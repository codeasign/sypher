# Local full-stack verification only — NOT part of the production
# architecture. Overrides just the port mappings so this can run
# side-by-side with the native local-dev Caddy already bound to host 80/443
# for *.sypher.local (see repo-root `Caddyfile`), and exposes api/web
# directly for easier direct curl-based checks alongside the Caddy path.
#
# Usage (needs a local .env — see .env.example, but with WEB_DOMAIN=
# localhost:8080 and API_DOMAIN=localhost:8081 so Caddy serves plain HTTP
# instead of attempting Let's Encrypt for a non-existent public domain):
#   docker compose -f docker-compose.yml -f docker-compose.local-test.yml up --build

services:
  postgres:
    ports:
      - '127.0.0.1:15432:5432'

  api:
    ports:
      - '127.0.0.1:14000:4000'

  web:
    ports:
      - '127.0.0.1:13002:3002'

  caddy:
    # Compose's default array merge APPENDS to the base file's `ports:`
    # (80:80, 443:443) rather than replacing it — !override fully replaces
    # instead, since binding 80/443 here would collide with the native
    # local-dev Caddy already running on this host for *.sypher.local.
    ports: !override
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:8081:8081'
      - '127.0.0.1:8082:8082'
