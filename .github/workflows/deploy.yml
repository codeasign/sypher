name: Build & Deploy

# Builds apps/api and apps/web Docker images in CI and pushes them to
# GitHub Container Registry (ghcr.io) — the droplet only ever runs
# `docker compose pull && docker compose up -d`, never `docker build`.
# See docker-compose.yml's header comment for how the same compose file
# serves both local (`build:`) and production (`image:`) use.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          # Only meaningful for the web build — apps/api's Dockerfile has no
          # matching ARGs, so these are silently unused there. NEXT_PUBLIC_*
          # values are inlined into the client bundle at build time, so
          # they're set once here rather than at container-start; changing
          # one requires a new image, not just a redeploy with a new .env.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY=${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      # Placeholder until the droplet exists — see project notes: "don't
      # touch DigitalOcean yet." Once it does, this needs three repo
      # secrets (DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY) and the
      # droplet needs docker-compose.yml + a filled-in .env (API_IMAGE/
      # WEB_IMAGE pointing at :latest for this repo) checked out at
      # DEPLOY_PATH, plus `docker login ghcr.io` done once by hand if the
      # images are private.
      - name: Deploy to droplet
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Deploy step skipped
        if: ${{ vars.DEPLOY_ENABLED != 'true' }}
        run: |
          echo "Skipping droplet deploy — set the repo variable DEPLOY_ENABLED=true"
          echo "once the droplet exists and DROPLET_HOST/DROPLET_USER/DROPLET_SSH_KEY/DEPLOY_PATH secrets are set."
