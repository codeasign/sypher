# Standalone GreenMail — a local email sink for testing Sypher's
# transactional emails (welcome / set-password / password-reset /
# cohort-welcome). Same service as the `greenmail` entry in
# apps/api/docker-compose.yml; run ONE of them, not both (same ports).
#
#   docker compose -f greenmail.compose.yml up -d
#   docker compose -f greenmail.compose.yml logs -f     # every email, full text
#   docker compose -f greenmail.compose.yml down
#
# Point Sypher at it: set in apps/api/.env
#   EMAIL_TRANSPORT=smtp
#   SMTP_HOST=localhost
#   SMTP_PORT=3025
# then restart apps/api.
#
# Read the mail:
#   - `docker compose -f greenmail.compose.yml logs -f` (verbose = full body + links), or
#   - any IMAP client on localhost:3143 — username AND password both = the
#     recipient address (GreenMail auto-creates the mailbox on first delivery).

services:
  greenmail:
    image: greenmail/standalone:2.1.4
    container_name: sypher-greenmail
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: '-Dgreenmail.setup.test.all -Dgreenmail.auth.disabled -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.verbose'
    ports:
      - '3025:3025'   # SMTP
      - '3143:3143'   # IMAP
