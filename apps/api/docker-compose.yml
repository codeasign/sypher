services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sypher
      POSTGRES_PASSWORD: sypher
      POSTGRES_DB: sypher_next
    ports:
      # Non-default host port so this doesn't collide with any other local
      # Postgres instance. Dev-only, throwaway volume — not used in
      # staging/prod, which point DATABASE_URL at the shared hosting
      # provider's Postgres instance instead.
      - '5433:5432'
    volumes:
      - sypher_next_pgdata:/var/lib/postgresql/data

volumes:
  sypher_next_pgdata:
