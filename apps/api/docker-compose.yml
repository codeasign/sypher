services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sypher
      POSTGRES_PASSWORD: sypher
      POSTGRES_DB: sypher_next
    ports:
      # Non-default host port so this doesn't collide with any other local
      # Postgres instance. Dev-only, throwaway volume — not used in
      # staging/prod, which point DATABASE_URL at the shared hosting
      # provider's Postgres instance instead.
      - '5433:5432'
    volumes:
      - sypher_next_pgdata:/var/lib/postgresql/data

  # Local email sink. With EMAIL_TRANSPORT=smtp in apps/api/.env every
  # transactional email is sent here (SMTP localhost:3025) instead of
  # Brevo/Resend. Read it: `docker logs -f api-greenmail-1` (verbose — full
  # message incl. links), or an IMAP client on localhost:3143 (username AND
  # password = the recipient address). Never deployed.
  # Standalone copy: ../../greenmail.compose.yml — run one or the other.
  greenmail:
    image: greenmail/standalone:2.1.4
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: '-Dgreenmail.setup.test.all -Dgreenmail.auth.disabled -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.verbose'
    ports:
      - '3025:3025'
      - '3143:3143'

volumes:
  sypher_next_pgdata:
