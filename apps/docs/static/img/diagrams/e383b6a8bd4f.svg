table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">- Leaders must verify quorum for each write<br />   (not just heartbeats)<br />- Use bidirectional health checks<br />- Deploy leader lease that requires quorum for<br />   renewal</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(26, 32.5)"><g class="clusters"><g class="cluster" id="my-svg-RS" data-look="classic"><rect style="" x="8" y="-3" width="512.25" height="165"/><g class="cluster-label" transform="translate(76.625, 1)"><foreignObject width="375" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Result: Two leaders exist simultaneously</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-RX-4" data-look="classic" transform="translate(264.125, 90.5)"><rect class="basic label-container" style="" x="-217.625" y="-61" width="435.25" height="122"/><g class="label" style="" transform="translate(-215.625, -60)"><rect/><foreignObject width="431.25" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">│  Old leader (Node 2) accepts writes → Writes<br />are lost        │ │  New leader (Node 1)<br />accepts writes → Writes are saved       │ │ <br />When partition heals, Node 2's writes are<br />discarded         │</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="