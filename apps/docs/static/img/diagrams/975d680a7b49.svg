" transform="translate(294, 112)"><rect class="basic label-container" style="" x="-241" y="-68" width="482" height="136"/><g class="label" style="" transform="translate(-225, -60)"><rect/><foreignObject width="450" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">❌ Health Check Theater<br />  HTTP 200 on port but app is broken → users get<br />      errors<br />  Fix: three-tier health checks with dependency<br />      verification</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-d-5" data-look="classic" transform="translate(880.0625, 112)"><rect class="basic label-container" style="" x="-255.0625" y="-56" width="510.125" height="112"/><g class="label" style="" transform="translate(-239.0625, -48)"><rect/><foreignObject width="478.125" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">❌ Infinite Rollback<br />  Rollback failed → try fix forward → make it worse<br />      → chaos<br />  Fix: test rollback before every deployment</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(90.625, 54.5)"><g class="clusters"><g class="cluster" id="my-svg-R1" data-look="classic"><rect style="" x="8" y="-3" width="1040.875" height="184"/><g class="cluster-label" transform="translate(528.4375, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M488.125,100L495.625,100C503.125,100,518.125,100,533.125,100C548.125,100,563.125,100,570.625,100L578.125,100" id="my-svg-L_a_b_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_a_b_0" data-points="W3sieCI6NDg4LjEyNSwieSI6MTAwfSx7IngiOjUzMy4xMjUsInkiOjEwMH0seyJ4Ijo1NzguMTI1LCJ5IjoxMDB9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_a_b_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-a-0" data-look="classic" transform="translate(270.5625, 100)"><rect class="basic label-container" style="" x="-217.5625" y="-44" width="435.125" height="88"/><g class="label" style="" transform="translate(-201.5625, -36)"><rect/><foreignObject width="403.125" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">❌ Friday Afternoon Deploy<br />  4:30 PM + no rollback = weekend emergency<br />  Fix: deploy freeze after Thursday noon</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-b-1" data-look="classic" transform="translate(791, 100)"><rect class="basic label-container" style="" x="-212.875" y="-56" width="425.75" height="112"/><g class="label" style="" transform="translate(-196.875, -48)"><rect/><foreignObject width="393.75" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">❌ Skip-the-Canary Gambit<br />  "It's a tiny change" → 30-minute service<br />      degradation<br />  Fix: mandatory canary for all changes</div><p></p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-e-8" data-look="classic" transform="translate(619.0625, 641.5)"><rect class="basic label-container" style="" x="-255.0625" y="-68" width="510.125" height="136"/><g class="label" style="" transform="translate(-239.0625, -60)"><rect/><foreignObject width="478.125" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">❌ Manual Gatekeeper<br />  Senior engineer must click "proceed" = bottleneck<br />      + delays<br />  Fix: Automated metric-based gating with<br />      exception-only oversight</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>