aces; line-height: 1.5; max-width: 300px; text-align: center; width: 300px;"><span class="nodeLabel"><p>LAYER 6: READ AGGREGATOR<br />[Parallel Fan-out] [Cache Layer]<br />Queries all 1024 shards → sum → cache<br />Cache TTL: 100ms for hot counters</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(4.6875, 22)"><g class="clusters"><g class="cluster" id="my-svg-R1" data-look="classic"><rect style="" x="8" y="-3" width="1181.625" height="232"/><g class="cluster-label" transform="translate(598.8125, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M372.5,124L377.917,124C383.333,124,394.167,124,404.333,124C414.5,124,424,124,428.75,124L433.5,124" id="my-svg-L_l1_l2_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_l1_l2_0" data-points="W3sieCI6MzcyLjUsInkiOjEyNH0seyJ4Ijo0MDUsInkiOjEyNH0seyJ4Ijo0MzcuNSwieSI6MTI0fV0=" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/><path d="M769.5,124L774.917,124C780.333,124,791.167,124,801.333,124C811.5,124,821,124,825.75,124L830.5,124" id="my-svg-L_l2_l3_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_l2_l3_0" data-points="W3sieCI6NzY5LjUsInkiOjEyNH0seyJ4Ijo4MDIsInkiOjEyNH0seyJ4Ijo4MzQuNSwieSI6MTI0fV0=" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_l1_l2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_l2_l3_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-l1-0" data-look="classic" transform="translate(206.5, 124)"><rect class="basic label-container" style="" x="-166" y="-80" width="332" height="160"/><g class="label" style="" transform="translate(-150, -72)"><rect/><foreignObject width="300" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 300px; text-align: center; width: 300px;"><span class="nodeLabel"><p>LAYER 1: INGESTION<br />[API Gateway] → [Rate Limiter] → [Validator]<br />Accepts HTTP/gRPC. Validates payload.<br />Rejects &gt; 50K req/s per client.</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-l2-1" data-look="classic" transform="translate(603.5, 124)"><rect class="basic label-container" style="" x="-166" y="-68" width="332" height="136"/><g class="label" style="" transform="translate(-150, -60)"><rect/><foreignObject width="300" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 300px; text-align: center; width: 300px;"><span class="nodeLabel"><p>LAYER 2: SHARD ROUTER<br />[Consistent Hash Ring]<br />hash(key) % 1024 → shard_id<br />Virtual nodes=256 per physical node</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-l3-2" data-look="classic" transform="translate(995.8125, 124)"><rect class="basic label-container" style="" x="-161.3125" y="-80" width="322.625" height="160"/><g class="label" style="" transform="translate(-145.3125, -72)"><rect/><foreignObject width="290.625" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 300px; text-align: center;"><span class="nodeLabel"><p>LAYER 3: COUNTER SHARD<br />(Redis or in-memory node)<br />Per-key state machine<br />{counter_key → [value, version,<br /> last_write_timestamp,<br /> delta_vector]}</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-lg-16" data-look="classic" transform="translate(603.5, 619)"><rect class="basic label-container" style="" x="-166" y="-32" width="332" height="64"/><g class="label" style="" transform="translate(-150, -24)"><rect/><foreignObject width="300" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 300px; text-align: center; width: 300px;"><span class="nodeLabel"><p>Legend: [ ] = service   { } = cache   ( ) = queue</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>