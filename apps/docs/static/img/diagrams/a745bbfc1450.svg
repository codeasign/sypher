ransform="translate(-93.75, -72)"><rect/><foreignObject width="187.5" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left">Node A's digest:<br />Node A: alive, inc 5<br />Node B: alive, inc 3<br />...<br />Node X: JOINED, inc1<br />Node Y: alive, inc 2</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-dn-2" data-look="classic" transform="translate(410.75, 102.5)"><rect class="basic label-container" style="" x="-95.75" y="-73" width="191.5" height="146"/><g class="label" style="" transform="translate(-93.75, -72)"><rect/><foreignObject width="187.5" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left">Node N's digest:<br />Node A: alive, inc 5<br />Node B: alive, inc 3<br />...<br />(missing Node X!)<br />Node Y: alive, inc 2</div><p></p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-TX-5" data-look="classic" transform="translate(287, 311)"><rect class="basic label-container" style="" x="-217.625" y="-25" width="435.25" height="50"/><g class="label" style="" transform="translate(-215.625, -24)"><rect/><foreignObject width="431.25" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Node N merges Node X into its membership list.<br />Convergence restored in one additional round.</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" floo