wBox="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5;"/></marker><marker id="my-svg_flowchart-v2-crossStart-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"/></marker><g class="root"><g class="clusters"/><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="root" transform="translate(0, 22)"><g class="clusters"><g class="cluster" id="my-svg-G4" data-look="classic"><rect style="" x="8" y="-3" width="1084.75" height="453"/><g class="cluster-label" transform="translate(414.4375, 1)"><foreignObject width="271.875" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Gossip Round 4 (Anti-Entropy)</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M494.25,234.5L496.5,234.5C498.75,234.5,503.25,234.5,507.75,234.5C512.25,234.5,516.75,234.5,519,234.5L521.25,234.5" id="my-svg-L_IN_EX_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_IN_EX_0" data-points="W3sieCI6NDk0LjI1LCJ5IjoyMzQuNX0seyJ4Ijo1MDcuNzUsInkiOjIzNC41fSx7IngiOjUyMS4yNSwieSI6MjM0LjV9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_IN_EX_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-IN-0" data-look="classic" transform="translate(257.875, 234.5)"><rect class="basic label-container" style="" x="-236.375" y="-205" width="472.75" height="410"/><g class="label" style="" transform="translate(-234.375, -204)"><rect/><foreignObject width="468.75" height="408"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">All 16 nodes are informed. Gossip continues for:<br /><br />1. Redundant confirmation --- If Node N missed the<br />   original message due to a dropped packet, it<br />       still<br />   receives the information from a different<br />       source.<br /><br />2. Anti-entropy reconciliation --- Members compare<br />   full state digests. If any node missed a<br />       previous<br />   membership change (not just this one), it is<br />   detected and corrected.<br /><br />3. New state changes --- Meanwhile, the cluster<br />   continues to change. New nodes join. Nodes go<br />   offline. Each round spreads the latest delta.</div><p></p></span></div></foreignObject></g></g><g class="root" transform="translate(513.25, 55)"><g class="clusters"><g class="cluster" id="my-svg-EX" data-look="classic"><rect style="" x="8" y="-3" width="558" height="365"/><g class="cluster-label" transform="translate(287, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M287,234L287,238.333C287,242.667,287,251.333,287,260C287,268.667,287,277.333,287,281.667L287,286" id="my-svg-L_RW_TX_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_RW_TX_0" data-points="W3sieCI6Mjg3LCJ5IjoyMzR9LHsieCI6Mjg3LCJ5IjoyNjB9LHsieCI6Mjg3LCJ5IjoyODZ9XQ==" data-look="classic"/></g>