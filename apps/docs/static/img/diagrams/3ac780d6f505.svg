-84)"><rect/><foreignObject width="487.5" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">│  Candidate's lastLogTerm &gt; my lastLogTerm<br />→ grant               │ │  Candidate's<br />lastLogTerm == my lastLogTerm AND                 <br />│ │    Candidate's lastLogIndex &gt;= my<br />lastLogIndex → grant          │ │  Otherwise<br />→ reject                                            <br />│</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(26, 32.5)"><g class="clusters"><g class="cluster" id="my-svg-RI" data-look="classic"><rect style="" x="8" y="-3" width="671.625" height="213"/><g class="cluster-label" transform="translate(142.25, 1)"><foreignObject width="403.125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Receiving node implementation (pseudocode):</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-PC-4" data-look="classic" transform="translate(343.8125, 114.5)"><rect class="basic label-container" style="" x="-297.3125" y="-85" width="594.625" height="170"/><g class="label" style="" transform="translate(-295.3125, -84)"><rect/><foreignObject width="590.625" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">1. Reply false if term &lt; currentTerm (§5.1)<br />2. Reply false if votedFor is not null or candidateId (§5.2)<br />3. Reply false if candidate's log is not at least as up-to-date<br />   as receiver's log [§5.4]:<br />     a. Compare lastLogTerm — higher term wins<br />     b. If same term, compare lastLogIndex — higher index wins<br />4. If all checks pass: set votedFor = candidateId, grant vote</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>