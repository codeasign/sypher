r cleared</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-CR-3" data-look="classic" transform="translate(462.5, 224)"><rect class="basic label-container" style="" x="-128.5625" y="-25" width="257.125" height="50"/><g class="label" style="" transform="translate(-126.5625, -24)"><rect/><foreignObject width="253.125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 450px; text-align: center;"><span class="nodeLabel"><p>CRASH<br />Node 3 loses power at t=5ms</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-A-4" data-look="classic" transform="translate(235, 312)"><rect class="basic label-container" style="" x="-227" y="-61" width="454" height="122"/><g class="label" style="" transform="translate(-225, -60)"><rect/><foreignObject width="450" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 450px; text-align: center; width: 450px;"><span class="nodeLabel"><p>If write was committed to DB before crash:<br />Data survived. Load balancer detects failure at t=20ms.<br />New requests go to Node 5. Next GET returns committed data.</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-B-5" data-look="classic" transform="translate(690, 312)"><rect class="basic label-container" style="" x="-227" y="-49" width="454" height="98"/><g class="label" style="" transform="translate(-225, -48)"><rect/><foreignObject width="450" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 450px; text-align: center; width: 450px;"><span class="nodeLabel"><p>If write was only in app buffer before crash:<br />Data LOST. Client received HTTP 200 at t=4ms.<br />Client retries. Order not found. Duplicate order or gap.</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-RS-6" data-look="classic" transform="translate(462.5, 412)"><rect class="basic label-container" style="" x="-227" y="-37" width="454" height="74"/><g class="label" style="" transform="translate(-225, -36)"><rect/><foreignObject width="450" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 450px; text-align: center; width: 450px;"><span class="nodeLabel"><p>Resolution: Write to DB BEFORE sending 200 to client.<br />Never acknowledge a write before it is durable.</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>