/foreignObject></g></g><g class="node default" id="my-svg-flowchart-t5-9" data-look="classic" transform="translate(963, 160)"><rect class="basic label-container" style="" x="-146" y="-116" width="292" height="232"/><g class="label" style="" transform="translate(-130, -108)"><rect/><foreignObject width="260" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>t5: Cascading to other services<br />Load balancer detects app unhealthy<br />Traffic redirected to other app instances<br />Those instances also hit the broken cache<br />System-wide write outage</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-MT-16" data-look="classic" transform="translate(606, 773.5)"><rect class="basic label-container" style="" x="-146" y="-80" width="292" height="160"/><g class="label" style="" transform="translate(-130, -72)"><rect/><foreignObject width="260" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>Mitigation: Circuit breaker to fail fast, fallback to write-around,<br />limit retry queue size, isolate write failures from read path.</p></span></div></foreignObject></g></g><g class="root" transform="translate(80, 54.5)"><g class="clusters"><g class="cluster" id="my-svg-CR0" data-look="classic"><rect style="" x="8" y="-3" width="1036" height="208"/><g class="cluster-label" transform="translate(526, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M235,112L242.5,112C250,112,265,112,279.333,112C293.667,112,307.333,112,314.167,112L321,112" id="my-svg-L_t0_t1_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_t0_t1_0" data-points="W3sieCI6MjM1LCJ5IjoxMTJ9LHsieCI6MjgwLCJ5IjoxMTJ9LHsieCI6MzI1LCJ5IjoxMTJ9XQ==" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/><path d="M617,112L624.5,112C632,112,647,112,661.333,112C675.667,112,689.333,112,696.167,112L703,112" id="my-svg-L_t1_t2_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_t1_t2_0" data-points="W3sieCI6NjE3LCJ5IjoxMTJ9LHsieCI6NjYyLCJ5IjoxMTJ9LHsieCI6NzA3LCJ5IjoxMTJ9XQ==" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_t0_t1_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_t1_t2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-t0-0" data-look="classic" transform="translate(144, 112)"><rect class="basic label-container" style="" x="-91" y="-20" width="182" height="40"/><g class="label" style="" transform="translate(-75, -12)"><rect/><foreignObject width="150" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>t0: DB goes down</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-t1-1" data-look="classic" transform="translate(471, 112)"><rect class="basic label-container" style="" x="-146" y="-44" width="292" height="88"/><g class="label" style="" transform="translate(-130, -36)"><rect/><foreignObject width="260" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>t1: First write fails<br />Cache attempts DB write → timeout → error</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-t2-2" data-look="classic" transform="translate(853, 112)"><rect class="basic label-container" style="" x="-146" y="-68" width="292" height="136"/><g class="label" style="" transform="translate(-130, -60)"><rect/><foreignObject width="260" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>t2: Retry queue fills<br />Retry 1: 100ms → fail<br />Retry 2: 500ms → fail<br />Retry 3: 2,500ms → fail → dead-letter</p></span></div></foreignObject></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>