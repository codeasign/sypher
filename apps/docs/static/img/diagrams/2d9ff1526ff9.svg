ass="edgeLabel" transform="translate(426.5625, 117)"><g class="label" data-id="L_sS_iI_0" transform="translate(-42.1875, -12)"><foreignObject width="84.375" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>recv info</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(821.6875, 193)"><g class="label" data-id="L_iI_rR_0" transform="translate(-89.0625, -12)"><foreignObject width="178.125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>spread to all peers</p></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_nt_iI_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-sS-0" data-look="classic" transform="translate(196.1875, 117)"><rect class="basic label-container" style="" x="-86.3125" y="-68" width="172.625" height="136"/><g class="label" style="" transform="translate(-70.3125, -60)"><rect/><foreignObject width="140.625" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left">Susceptible (S)<br /><br />Has not<br />heard<br />the rumor</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-iI-1" data-look="classic" transform="translate(600.6875, 193)"><rect class="basic label-container" style="" x="-76.9375" y="-68" width="153.875" height="136"/><g class="label" style="" transform="translate(-60.9375, -60)"><rect/><foreignObject width="121.875" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left">Infective (I)<br /><br />Actively<br />gossiping<br />the rumor</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-rR-2" data-look="classic" transform="translate(1033.3125, 193)"><rect class="basic label-container" style="" x="-67.5625" y="-68" width="135.125" height="136"/><g class="label" style="" transform="translate(-51.5625, -60)"><rect/><foreignObject width="103.125" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left">Removed (R)<br /><br />Has info,<br />no longer<br />spreading</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-nt-7" data-look="classic" transform="translate(196.1875, 269)"><rect class="basic label-container" style="" x="-133.1875" y="-44" width="266.375" height="88"/><g class="label" style="" transform="translate(-117.1875, -36)"><rect/><foreignObject width="234.375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left">Re-infection possible if<br />new rumor variant arrives<br />(different incarnation)</div><p></p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-EV-10" data-look="classic" transform="translate(611.9375, 596.5)"><rect class="basic label-container" style="" x="-316" y="-92" width="632" height="184"/><g class="label" style="" transform="translate(-300, -84)"><rect/><foreignObject width="600" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Cluster state evolution over rounds:<br /><br />Round 0:  S = N,   I = 0,   R = 0<br />Round 1:  S = N-1, I = 1,   R = 0    (source receives news)<br />Round 2:  S = N-4, I = 4,   R = 0    (source + 3 peers)<br />Round 3:  S = N-13,I = 13,  R = 0    (all newly infected spread)<br />Round t:  S --&gt; 0, I --&gt; 0, R = N    (convergence)</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>