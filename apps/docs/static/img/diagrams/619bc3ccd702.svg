0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Serverless platforms favor AP:<br />─ Functions are always available for invocation<br />─ Asynchronous event sources will retry<br />─ State is deferred to AP data stores (DynamoDB, S3)<br />─ Consistency is the application's responsibility<br /><br />Consequence: You must design for eventual consistency.<br />- Read-after-write: Use DynamoDB strongly consistent reads<br />- Distributed transactions: Use Saga pattern, not 2PC<br />- Idempotency: Design all handlers for duplicate detection</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>