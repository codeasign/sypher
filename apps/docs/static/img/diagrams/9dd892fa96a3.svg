asic label-container" style="" x="-108.03125" y="-39" width="216.0625" height="78"/><g class="label" style="" transform="translate(-78.03125, -24)"><rect/><foreignObject width="156.0625" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 170px; text-align: center;"><span class="nodeLabel"><p>YOU (at the terminal)<br />types a question</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-P-1" data-look="classic" transform="translate(123, 367)"><rect class="basic label-container" style="" x="-115" y="-231" width="230" height="462"/><g class="label" style="" transform="translate(-85, -216)"><rect/><foreignObject width="170" height="432"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 170px; text-align: center; width: 170px;"><span class="nodeLabel"><p>Python Script (research.py)<br />1. Reads question<br />from input<br />2. Loads API key<br />from env variable<br />3. Builds the<br />prompt message<br />4. Sends request<br />to LLM API<br />5. Parses the<br />JSON response<br />6. Prints the<br />answer to you<br />7. Saves conversation<br />to a file<br />8. Loops back to<br />step 1 for follow-ups</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L-2" data-look="classic" transform="translate(123, 783)"><rect class="basic label-container" style="" x="-115" y="-87" width="230" height="174"/><g class="label" style="" transform="translate(-85, -72)"><rect/><foreignObject width="170" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 170px; text-align: center; width: 170px;"><span class="nodeLabel"><p>LLM API (Anthropic / OpenAI)<br />The Large Language Model processes<br />your prompt and generates a response</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R-3" data-look="classic" transform="translate(123, 1007)"><rect class="basic label-container" style="" x="-115" y="-39" width="230" height="78"/><g class="label" style="" transform="translate(-85, -24)"><rect/><foreignObject width="170" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 170px; text-align: center; width: 170px;"><span class="nodeLabel"><p>Response displayed to you</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-4" data-look="classic" transform="translate(123, 1135)"><rect class="basic label-container" style="" x="-108.8671875" y="-39" width="217.734375" height="78"/><g class="label" style="" transform="translate(-78.8671875, -24)"><rect/><foreignObject width="157.734375" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 170px; text-align: center;"><span class="nodeLabel"><p>Conversation saved to<br />research_log.txt</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>