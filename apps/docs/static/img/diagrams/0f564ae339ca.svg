75,160C571.542,160,580.208,160,584.542,160L588.875,160" id="my-svg-L_EL_WV_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_EL_WV_0" data-points="W3sieCI6NTM2Ljg3NSwieSI6MTYwfSx7IngiOjU2Mi44NzUsInkiOjE2MH0seyJ4Ijo1ODguODc1LCJ5IjoxNjB9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_EL_WV_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(580.875, 32.5)"><g class="clusters"><g class="cluster" id="my-svg-WV" data-look="classic"><rect style="" x="8" y="-3" width="662.25" height="261"/><g class="cluster-label" transform="translate(259.4375, 1)"><foreignObject width="159.375" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Write Validation:</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-B-4" data-look="classic" transform="translate(339.125, 138.5)"><rect class="basic label-container" style="" x="-292.625" y="-109" width="585.25" height="218"/><g class="label" style="" transform="translate(-290.625, -108)"><rect/><foreignObject width="581.25" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Write comes with token=1  → Current token=3 →<br />    REJECT<br />Write comes with token=2  → Current token=3 →<br />    REJECT<br />Write comes with token=3  → Current token=3 →<br />    ACCEPT<br />Write comes with token=4  → Current token=3 →<br />    ACCEPT<br />                                                   (pre-grant)</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(26, 44.5)"><g class="clusters"><g class="cluster" id="my-svg-EL" data-look="classic"><rect style="" x="8" y="-3" width="502.875" height="237"/><g class="cluster-label" transform="translate(212.5625, 1)"><foreignObject width="93.75" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Event Log:</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-A-3" data-look="classic" transform="translate(259.4375, 126.5)"><rect class="basic label-container" style="" x="-212.9375" y="-97" width="425.875" height="194"/><g class="label" style="" transform="translate(-210.9375, -96)"><rect/><foreignObject width="421.875" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Token 1: Node A elected. Writes accepted with<br />    token=1.<br />Token 2: Node A partitioned. Node B elected.<br />         All writes from token=1 now invalid.<br />         Network fencing: "Node A, token=1 is<br />             expired."<br />Token 3: Node B partitioned. Node C elected.<br />         All writes from token=2 now invalid.</div><p></p></span></div></foreignObject></g></g></g></g></g></g><g class="node default" id="my-svg-flowchart-TX-7" data-look="classic" transform="translate(653.0625, 686.5)"><rect class="basic label-container" style="" x="-236.375" y="-25" width="472.75" height="50"/><g class="label" style="" transform="translate(-234.375, -24)"><rect/><foreignObject width="468.75" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">A stale leader with token=1 cannot write to a node<br />that has seen token=2 or higher.</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>