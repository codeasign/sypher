 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5;"/></marker><marker id="my-svg_flowchart-v2-crossStart-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"/></marker><g class="root"><g class="clusters"/><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="root" transform="translate(0, 22)"><g class="clusters"><g class="cluster" id="my-svg-ST" data-look="classic"><rect style="" x="8" y="-3" width="968" height="554"/><g class="cluster-label" transform="translate(327.9375, 1)"><foreignObject width="328.125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>CAP Theorem and Write-Through Cache</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M492,235.5L492,237.917C492,240.333,492,245.167,492,250C492,254.833,492,259.667,492,262.083L492,264.5" id="my-svg-L_ROW_NS_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_ROW_NS_0" data-points="W3sieCI6NDkyLCJ5IjoyMzUuNX0seyJ4Ijo0OTIsInkiOjI1MH0seyJ4Ijo0OTIsInkiOjI2NC41fV0=" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_ROW_NS_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(12, 267.5)"><g class="clusters"><g class="cluster" id="