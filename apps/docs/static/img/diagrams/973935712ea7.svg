ntainer" style="" x="-60.5703125" y="-27" width="121.140625" height="54"/><g class="label" style="" transform="translate(-30.5703125, -12)"><rect/><foreignObject width="61.140625" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Call Tool</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-2" data-look="classic" transform="translate(567.1640625, 70)"><rect class="basic label-container" style="" x="-80.5390625" y="-27" width="161.078125" height="54"/><g class="label" style="" transform="translate(-50.5390625, -12)"><rect/><foreignObject width="101.078125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Process Result</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-D-3" data-look="classic" transform="translate(796.09375, 70)"><rect class="basic label-container" style="" x="-73.390625" y="-27" width="146.78125" height="54"/><g class="label" style="" transform="translate(-43.390625, -12)"><rect/><foreignObject width="86.78125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Decide Next</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-Loop-4" data-look="classic" transform="translate(1086.984375, 179)"><rect class="basic label-container" style="" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Loop continues until:<br />Claude has enough info to answer<br />Claude reaches max tool calls<br />You cancel the operation<br />A tool returns an error</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Example-5" data-look="classic" transform="translate(1396.984375, 179)"><rect class="basic label-container" style="" x="-130" y="-171" width="260" height="342"/><g class="label" style="" transform="translate(-100, -156)"><rect/><foreignObject width="200" height="312"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Example: 'Find the slowest query in my database'<br />1. Claude calls list_directory on /var/log<br />2. Claude calls read_file on postgresql.log<br />3. Claude identifies slow queries from log patterns<br />4. Claude calls database query tool to get EXPLAIN<br />5. Claude synthesizes the answer with recommendations</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>