 center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-M1-8" data-look="classic" transform="translate(173, 108.5)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>SRAM (192 KB / SM)<br />Bandwidth: 20 TB/s<br />← FlashAttention operates here</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-M2-9" data-look="classic" transform="translate(173, 285.5)"><rect class="basic label-container" style="" x="-109.6875" y="-39" width="219.375" height="78"/><g class="label" style="" transform="translate(-79.6875, -24)"><rect/><foreignObject width="159.375" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>L2 Cache (40 MB)<br />Bandwidth: 4 TB/s</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-M3-10" data-look="classic" transform="translate(173, 462.5)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>HBM (80 GB)<br />Bandwidth: 2 TB/s<br />← Standard attention materializes here</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(380, 0)"><g class="clusters"><g class="cluster" id="my-svg-FA" data-look="classic"><rect style="" x="8" y="8" width="330" height="786"/><g class="cluster-label" transform="translate(107.375, 8)"><foreignObject width="131.25" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>FlashAttention</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M173,387.5L173,393.75C173,400,173,412.5,173,425C173,437.5,173,450,173,456.25L173,462.5" id="my-svg-L_F1_F2_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_F1_F2_0" data-points="W3sieCI6MTczLCJ5IjozODcuNX0seyJ4IjoxNzMsInkiOjQyNX0seyJ4IjoxNzMsInkiOjQ2Mi41fV0=" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_F1_F2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-F1-4" data-look="classic" transform="translate(173, 216.5)"><rect class="basic label-container" style="" x="-130" y="-171" width="260" height="342"/><g class="label" style="" transform="translate(-100, -156)"><rect/><foreignObject width="200" height="312"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Tile 0: Q[0:64] × K[0:64]^T → S[0:64] × V[0:64] → acc<br />Tile 1: Q[0:64] × K[64:128]^T → update acc<br />Tile 2: Q[0:64] × K[128:192]^T → update acc<br />...<br />Tile 63: Q[0:64] × K[4032:4096]^T → final acc</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-F2-5" data-look="classic" transform="translate(173, 609.5)"><rect class="basic label-container" style="" x="-130" y="-147" width="260" height="294"/><g class="label" style="" transform="translate(-100, -132)"><rect/><foreignObject width="200" height="264"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Each tile fits in GPU SRAM (192 KB per SM)<br />No intermediate materialization in HBM<br />Memory: O(n) = tokens × d_model<br />Speed: 2-3x faster, even with same compute O(n²d)</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(0, 156)"><g class="clusters"><g class="cluster" id="my-svg-SA" data-look="classic"><rect style="" x="8" y="8" width="330" height="474"/><g class="cluster-label" transform="translate(88.625, 8)"><foreignObject width="168.75" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Standard Attention</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M173,219.5L173,225.75C173,232,173,244.5,173,257C173,269.5,173,282,173,288.25L173,294.5" id="my-svg-L_S1_S2_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_S1_S2_0" data-points="W3sieCI6MTczLCJ5IjoyMTkuNX0seyJ4IjoxNzMsInkiOjI1N30seyJ4IjoxNzMsInkiOjI5NC41fV0=" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_S1_S2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-S1-0" data-look="classic" transform="translate(173, 132.5)"><rect class="basic label-container" style="" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Q (1x4k) × K^T (4kx4k) = S (1x4k) × V (4kx128) = O (1x128)<br />16M floats = 64 MB in HBM</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S2-1" data-look="classic" transform="translate(173, 369.5)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Memory: O(n²) = 64 MB for n=4096<br />For batch=32: 2 GB just for attention matrix</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>