g-flowchart-B-1" data-look="classic" transform="translate(301.625, 90.5)"><rect class="basic label-container" style="" x="-255.125" y="-61" width="510.25" height="122"/><g class="label" style="" transform="translate(-253.125, -60)"><rect/><foreignObject width="506.25" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">{In-Memory Aggregator}      {Time-Series Database}<br /> Per-minute window:            Per-minute row:<br /> total=12000, bad=3            ts=2024-01-15T14:01:00Z<br /> good_ratio=0.99975            good=11997, bad=3<br />Output: windowed aggregates at 1-minute resolution</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(26, 44.5)"><g class="clusters"><g class="cluster" id="my-svg-L1" data-look="classic"><rect style="" x="8" y="-3" width="615.375" height="141"/><g class="cluster-label" transform="translate(203.1875, 1)"><foreignObject width="225" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Layer 1: Instrumentation</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-A-0" data-look="classic" transform="translate(315.6875, 78.5)"><rect class="basic label-container" style="" x="-269.1875" y="-49" width="538.375" height="98"/><g class="label" style="" transform="translate(-267.1875, -48)"><rect/><foreignObject width="534.375" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">[Service A] ──&gt; Counters: total_requests, failed_requests<br />[Service B] ──&gt; Histograms: latency_buckets[0..1000ms]<br />[Service C] ──&gt; Gauges: active_connections, queue_depth<br />Output: raw metric events at request granularity</div><p></p></span></div></foreignObject></g></g></g></g></g></g><g class="root" transform="translate(66.75, 270.5)"><g class="clusters"><g class="cluster" id="my-svg-R2" data-look="classic"><rect style="" x="8" y="-3" width="1194.125" height="256"/><g class="cluster-label" transform="translate(605.0625, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M565,136L569.333,136C573.667,136,582.333,136,590.333,136C598.333,136,605.667,136,609.333,136L613,136" id="my-svg-L_L3_L4_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_L3_L4_0" data-points="W3sieCI6NTY1LCJ5IjoxMzZ9LHsieCI6NTkxLCJ5IjoxMzZ9LHsieCI6NjE3LCJ5IjoxMzZ9XQ==" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_L3_L4_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(609, 56.5)"><g class="clusters"><g class="cluster" id="my-svg-L4" data-look="classic"><rect style="" x="8" y="-3" width="559.125" height="165"/><g class="cluster-label" transform="translate(207.875, 1)"><foreignObject width="159.375" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Layer 4: Alerting</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-D-5" data-look="classic" transform="translate(287.5625, 90.5)"><rect class="basic label-container" style="" x="-241.0625" y="-61" width="482.125" height="122"/><g class="label" style="" transform="translate(-239.0625, -60)"><rect/><foreignObject width="478.125" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">[Alert Manager]<br /> Burn rate 14.4 over 5 min  ──&gt; PagerDuty<br /> Burn rate 6.0 over 30 min  ──&gt; Ticket system<br /> Burn rate 1.0 over 6 hrs   ──&gt; Email notification<br /> Burn rate 0.5 over 3 days  ──&gt; Dashboard highlight</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(26, 32.5)"><g class="clusters"><g class="cluster" id="my-svg-L3" data-look="classic"><rect style="" x="8" y="-3" width="531" height="213"/><g class="cluster-label" transform="translate(184.4375, 1)"><foreignObject width="178.125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Layer 3: Evaluation</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-C-4" data-look="classic" transform="translate(273.5, 114.5)"><rect class="basic label-container" style="" x="-227" y="-85" width="454" height="170"/><g class="label" style="" transform="translate(-225, -84)"><rect/><foreignObject width="450" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">{SLO Evaluator}<br /> For each SLO:<br /> - Read last 30 days of 1-minute windows<br /> - Count good minutes / total minutes<br /> - Compare to SLO target<br /> - Compute burn rate over multiple windows<br /> Output: SLO compliance status, burn rate vector</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>