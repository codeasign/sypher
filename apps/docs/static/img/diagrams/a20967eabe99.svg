nts="W3sieCI6NDg4LCJ5IjoxMzguNX0seyJ4Ijo1MTQsInkiOjEzOC41fSx7IngiOjU0MCwieSI6MTM4LjV9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_d1_d2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-d1-7" data-look="classic" transform="translate(261, 138.5)"><rect class="basic label-container" style="" x="-227" y="-109" width="454" height="218"/><g class="label" style="" transform="translate(-225, -108)"><rect/><foreignObject width="450" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 450px; text-align: center; width: 450px;"><span class="nodeLabel"><p>CP (Consistency + Partition Tolerance)<br />During partition, block reads to affected keys<br />until invalidation confirmed across all nodes.<br />Pro: No stale reads. Available on partition heal.<br />Con: Reads may be blocked or fail during partition.<br />Used by: strongly consistent caches, financial data</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-d2-8" data-look="classic" transform="translate(767, 138.5)"><rect class="basic label-container" style="" x="-227" y="-109" width="454" height="218"/><g class="label" style="" transform="translate(-225, -108)"><rect/><foreignObject width="450" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 450px; text-align: center; width: 450px;"><span class="nodeLabel"><p>AP (Availability + Partition Tolerance)<br />During partition, serve cached data even if stale.<br />Invalidation is applied eventually when partition<br />heals.<br />Pro: Always available, no blocking.<br />Con: Stale reads during partition.<br />Used by: eventually consistent caches, most prod</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-co-0" data-look="classic" transform="translate(665.59375, 69.5)"><rect class="basic label-container" style="" x="-67.625" y="-37" width="135.25" height="74"/><g class="label" style="" transform="translate(-65.625, -36)"><rect/><foreignObject width="131.25" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 450px; text-align: center;"><span class="nodeLabel"><p>Consistency<br />(all nodes see<br />same data)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-cp-2" data-look="classic" transform="translate(524.5, 194.5)"><rect class="basic label-container" style="" x="-58.25" y="-61" width="116.5" height="122"/><g class="label" style="" transform="translate(-56.25, -60)"><rect/><foreignObject width="112.5" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 450px; text-align: center;"><span class="nodeLabel"><p>CP Strategy<br /><br />Block reads<br />until inval.<br />confirmed</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-ca-4" data-look="classic" transform="translate(748.375, 194.5)"><rect class="basic label-container" style="" x="-34.8125" y="-37" width="69.625" height="74"/><g class="label" style="" transform="translate(-32.8125, -36)"><rect/><foreignObject width="65.625" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 450px; text-align: center;"><span class="nodeLabel"><p>CA (not<br />in dist<br />caches)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-ap-6" data-look="classic" transform="translate(842.4375, 194.5)"><rect class="basic label-container" style="" x="-58.25" y="-61" width="116.5" height="122"/><g class="label" style="" transform="translate(-56.25, -60)"><rect/><foreignObject width="112.5" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 450px; text-align: center;"><span class="nodeLabel"><p>AP Strategy<br /><br />Serve stale<br />until inval.<br />arrives</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-nt-11" data-look="classic" transform="translate(524.5, 607.5)"><rect class="basic label-container" style="" x="-227" y="-37" width="454" height="74"/><g class="label" style="" transform="translate(-225, -36)"><rect/><foreignObject width="450" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 450px; text-align: center; width: 450px;"><span class="nodeLabel"><p>Most production caches choose AP: serve stale data<br />rather than fail the request.</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>