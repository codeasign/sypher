id #17  (1 byte)<br />sub-vector 3 → centroid #83  (1 byte)<br />...<br />sub-vector 8 → centroid #55  (1 byte)</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-CV-4" data-look="classic" transform="translate(731, 144)"><rect class="basic label-container" style="" x="-231.625" y="-56" width="463.25" height="112"/><g class="label" style="" transform="translate(-215.625, -48)"><rect/><foreignObject width="431.25" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p>Compressed vector: 8 bytes (vs 3072 bytes)<br />Compression ratio: 384x<br /><br />Trade-off: recall drops from 0.98 to 0.85-0.92</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(0, 22)"><g class="clusters"><g class="cluster" id="my-svg-R0" data-look="classic"><rect style="" x="8" y="-3" width="1111.625" height="184"/><g class="cluster-label" transform="translate(563.8125, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M529.25,100L532.667,100C536.083,100,542.917,100,549.083,100C555.25,100,560.75,100,563.5,100L566.25,100" id="my-svg-L_OV_SP_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_OV_SP_0" data-points="W3sieCI6NTI5LjI1LCJ5IjoxMDB9LHsieCI6NTQ5Ljc1LCJ5IjoxMDB9LHsieCI6NTcwLjI1LCJ5IjoxMDB9XQ==" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_OV_SP_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell