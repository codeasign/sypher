Availability SLI violated<br /><br />Step 2: Stream manifest delivered under 1 second?<br />  ✅ Yes ──&gt; Step 3<br />  ❌ No  ──&gt; FAIL: Latency SLI violated<br /><br />Step 3: CDN edge has content?<br />  ✅ Yes ──&gt; Step 4<br />  ❌ No  ──&gt; FAIL: CDN readiness SLI violated<br /><br />Step 4: Video starts playing within 2 seconds total?<br />  ✅ Yes ──&gt; SUCCESS: Streaming start SLI = good<br />  ❌ No  ──&gt; FAIL: Quality SLI violated</div><p></p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-PL-0" data-look="classic" transform="translate(103.1875, 247.5)"><rect class="basic label-container" style="" x="-81.6875" y="-13" width="163.375" height="26"/><g class="label" style="" transform="translate(-79.6875, -12)"><rect/><foreignObject width="159.375" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>User Presses Play</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-F-2" data-look="classic" transform="translate(1025.25, 247.5)"><rect class="basic label-container" style="" x="-273.875" y="-37" width="547.75" height="74"/><g class="label" style="" transform="translate(-271.875, -36)"><rect/><foreignObject width="543.75" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Quarterly SLI review: All streaming start failures are<br />categorized by root cause. CDN cache misses caused 40% of<br />failures in Q1 2026, driving a CDN pre-warming initiative.</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#0000