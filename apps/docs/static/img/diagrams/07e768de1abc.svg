wBox="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5;"/></marker><marker id="my-svg_flowchart-v2-crossStart-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"/></marker><g class="root"><g class="clusters"/><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="root" transform="translate(0, 22)"><g class="clusters"><g class="cluster" id="my-svg-ZK" data-look="classic"><rect style="" x="8" y="-3" width="1343.75" height="827"/><g class="cluster-label" transform="translate(539.25, 1)"><foreignObject width="281.25" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>ZooKeeper + Kafka Coordination</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M695.625,421.5L697.875,421.5C700.125,421.5,704.625,421.5,709.125,421.5C713.625,421.5,718.125,421.5,720.375,421.5L722.625,421.5" id="my-svg-L_C1_KC_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_C1_KC_0" data-points="W3sieCI6Njk1LjYyNSwieSI6NDIxLjV9LHsieCI6NzA5LjEyNSwieSI6NDIxLjV9LHsieCI6NzIyLjYyNSwieSI6NDIxLjV9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_C1_KC_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(714.625, 278.5)"><g class="clusters"><g class="cluster" id="my-svg-KC" data-look="classic"><rect style="" x="8" y="-3" width="615.625" height="292"/><g class="cluster-label" transform="translate(193.9375, 1)"><foreignObject width="243.75" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Kafka Controller Election:</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-EL-4" data-look="classic" transform="translate(315.8125, 154)"><rect class="basic label-container" style="" x="-297.3125" y="-109" width="594.625" height="218"/><g class="label" style="" transform="translate(-295.3125, -108)"><rect/><foreignObject width="590.625" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">1. Each broker tries to create /controller (ephemeral)<br />2. ZooKeeper's sequential consistency guarantees only one<br />   create succeeds → the first creator becomes controller<br />3. If the controller loses its ZooKeeper session (e.g., crash),<br />   the ephemeral znode is deleted<br />4. Other brokers receive a watch notification<br />5. The first broker to successfully create /controller becomes<br />   the new controller<br />6. The controller manages partition leader assignment</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(13.5, 32.5)"><g class="clusters"><g class="cluster" id="my-svg-C1" data-look="classic"><rect style="" x="8" y="-3" width="674.125" height="784"/><g class="cluster-label" transform="translate(345.0625, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M345.063,506L345.063,510.333C345.063,514.667,345.063,523.333,345.063,532C345.063,540.667,345.063,549.333,345.063,553.667L345.063,558" id="my-svg-L_EN_KF_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_EN_KF_0" data-points="W3sieCI6MzQ1LjA2MjUsInkiOjUwNn0seyJ4IjozNDUuMDYyNSwieSI6NTMyfSx7IngiOjM0NS4wNjI1LCJ5Ijo1NTh9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_EN_KF_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(24.5625, 561)"><g class="clusters"><g class="cluster" id="my-svg-KF" data-look="classic"><rect style="" x="8" y="-3" width="625" height="197"/><g class="cluster-label" transform="translate(273.625, 1)"><foreignObject width="93.75" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Key facts:</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-KY-1" data-look="classic" transform="translate(320.5, 106.5)"><rect class="basic label-container" style="" x="-302" y="-49" width="604" height="98"/><g class="label" style="" transform="translate(-300, -48)"><rect/><foreignObject width="600" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">- Kafka uses ZooKeeper for cluster metadata, not for data itself<br />- ZK session timeout: 6-18 seconds (configurable)<br />- Controller failover: 10-30 seconds<br />- Kafka 2.8+ supports KRaft (Raft-based, no ZooKeeper)</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(10.5, 48)"><g class="clusters"><g class="cluster" id="my-svg-EN" data-look="classic"><rect style="" x="8" y="-3" width="653.125" height="461"/><g class="cluster-label" transform="translate(179.875, 1)"><foreignObject width="309.375" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>ZooKeeper Ensemble (3 or 5 nodes)</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-TR-0" data-look="classic" transform="translate(334.5625, 238.5)"><rect class="basic label-container" style="" x="-316.0625" y="-181" width="632.125" height="362"/><g class="label" style="" transform="translate(-314.0625, -180)"><rect/><foreignObject width="628.125" height="360"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">│  │  /kafka                                                  │  │<br />│  │  ├── /controller            (ephemeral)  ← Controller   │  │<br />│  │  ├── /brokers                                            │  │<br />│  │  │   ├── /ids                                            │  │<br />│  │  │   │   ├── 0  (ephemeral)  ← Broker 1, us-east-1a     │  │<br />│  │  │   │   ├── 1  (ephemeral)  ← Broker 2, us-east-1b     │  │<br />│  │  │   │   └── 2  (ephemeral)  ← Broker 3, us-east-1c     │  │<br />│  │  │   └── /topics                                         │  │<br />│  │  │       └── /orders                                     │  │<br />│  │  │           ├── /partitions                              │  │<br />│  │  │           │   ├── /0  (leader, ISR, replicas)         │  │<br />│  │  │           │   ├── /1  (leader, ISR, replicas)         │  │<br />│  │  │           │   └── /2  (leader, ISR, replicas)         │  │<br />│  │  └── /admin                                              │  │<br />│  │      └── /reassign_partitions  (used during rebalancing)  │  │</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>