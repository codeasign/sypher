x="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5;"/></marker><marker id="my-svg_flowchart-v2-crossStart-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"/></marker><g class="root"><g class="clusters"/><g class="edgePaths"><path d="M553.25,447L553.25,447.5C553.25,448,553.25,449,553.25,450C553.25,451,553.25,452,553.25,452.5L553.25,453" id="my-svg-L_G0_G1_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_G0_G1_0" data-points="W3sieCI6NTUzLjI1LCJ5Ijo0NDd9LHsieCI6NTUzLjI1LCJ5Ijo0NTB9LHsieCI6NTUzLjI1LCJ5Ijo0NTN9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_G0_G1_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(289.625, 456)"><g class="clusters"><g class="cluster" id="my-svg-G1" data-look="classic"><rect style="" x="8" y="-3" width="511.25" height="219"/><g class="cluster-label" transform="translate(263.625, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="root" transform="translate(12, 37.5)"><g class="clusters"><g class="cluster" id="my-svg-C3" data-look="classic"><rect style="" x="8" y="-3" width="487.25" height="166"/><g class="cluster-label" transform="translate(68.8125, 1)"><foreignObject width="365.625" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>3. Dot Product — for normalized vectors</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-C3n-4" data-look="classic" transform="translate(251.625, 91)"><rect class="basic label-container" style="" x="-231.625" y="-44" width="463.25" height="88"/><g class="label" style="" transform="translate(-215.625, -36)"><rect/><foreignObject width="431.25" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 450px; text-align: center;"><span class="nodeLabel"><p>A·B = Σ(Ai × Bi)<br />Result: larger = more similar<br />Requires vectors to be length-normalized first</p></span></div></foreignObject></g></g></g></g></g></g><g class="root" transform="translate(0, 22)"><g class="clusters"><g class="cluster" id="my-svg-G0" data-look="classic"><rect style="" x="8" y="-3" width="1090.5" height="428"/><g class="cluster-label" transform="translate(553.25, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M537.75,222L540.333,222C542.917,222,548.083,222,553.25,222C558.417,222,563.583,222,566.167,222L568.75,222" id="my-svg-L_C1_C2_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_C1_C2_0" data-points="W3sieCI6NTM3Ljc1LCJ5IjoyMjJ9LHsieCI6NTUzLjI1LCJ5IjoyMjJ9LHsieCI6NTY4Ljc1LCJ5IjoyMjJ9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_C1_C2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(564.875, 82)"><g class="clusters"><g class="cluster" id="my-svg-C2" data-look="classic"><rect style="" x="3.875" y="-3" width="514.25" height="286"/><g class="cluster-label" transform="translate(7.875, 1)"><foreignObject width="506.25" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>2. Euclidean Distance (L2) — good for image embeddings</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-C2n-1" data-look="classic" transform="translate(261, 151)"><rect class="basic label-container" style="" x="-241" y="-104" width="482" height="208"/><g class="label" style="" transform="translate(-225, -96)"><rect/><foreignObject width="450" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 450px; text-align: center; width: 450px;"><span class="nodeLabel"><p>d(A,B) = √(Σ(Ai - Bi)²)<br /><br />Result: 0.0 = identical, larger = more different<br />A: [0.23, -0.45, 0.67]    B: [-0.15, 0.72, -0.33]<br />diff² = (0.38)² + (-1.17)² + (1.0)²<br />      = 0.1444 + 1.3689 + 1.0 = 2.5133<br />d = √2.5133 = 1.585</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(19.625, 34)"><g class="clusters"><g class="cluster" id="my-svg-C1" data-look="classic"><rect style="" x="3.875" y="-3" width="514.25" height="382"/><g class="cluster-label" transform="translate(7.875, 1)"><foreignObject width="506.25" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>1. Cosine Similarity (most common for text embeddings)</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-C1n-0" data-look="classic" transform="translate(261, 199)"><rect class="basic label-container" style="" x="-241" y="-152" width="482" height="304"/><g class="label" style="" transform="translate(-225, -144)"><rect/><foreignObject width="450" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 450px; text-align: center; width: 450px;"><span class="nodeLabel"><p>cos(θ) = (A · B) / (║A║ × ║B║)<br /><br />Result: 1.0 = same direction, 0.0 = orthogonal, -1.0 = opposite<br /><br />A: [0.23, -0.45, 0.67]    B: [0.19, -0.38, 0.71]<br />A·B = 0.23×0.19 + (-0.45)×(-0.38) + 0.67×0.71<br />    = 0.0437 + 0.171 + 0.4757<br />    = 0.6904<br />║A║ = √(0.23² + 0.45² + 0.67²) = 0.830<br />║B║ = √(0.19² + 0.38² + 0.71²) = 0.817<br />cos(θ) = 0.6904 / (0.830 × 0.817) = 0.690</p></span></div></foreignObject></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>