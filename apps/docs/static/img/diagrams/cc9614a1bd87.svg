spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Kafka Cluster (3 brokers, 12 partitions)<br />Topic: auth_events (retention 90 days, compaction enabled)<br />Partition 0: user 1,2,3 | Partition 1: user 4,5,6<br />Partition 2: user 7,8,9 | ...</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-AS-4" data-look="classic" transform="translate(138, 1023)"><rect class="basic label-container" style="" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Audit Storage Consumer<br />Writes to PostgreSQL (timescale for<br />time-series), partitioned by month + user_id</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-AC-6" data-look="classic" transform="translate(448, 1023)"><rect class="basic label-container" style="" x="-130" y="-159" width="260" height="318"/><g class="label" style="" transform="translate(-100, -144)"><rect/><foreignObject width="200" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Alert Consumer<br />Monitors: 5+ login failures in 1 min,<br />account lockout events, password changes<br />from new IP/device, MFA enrollment changes,<br />IdP linking from new IP, events from blocked IPs</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-ANC-8" data-look="classic" transform="translate(758, 1023)"><rect class="basic label-container" style="" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Analytics Consumer<br />Aggregates: login success rate, MFA adoption<br />rate, IdP usage breakdown, geographic login map</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-SC-10" data-look="classic" transform="translate(1068, 1023)"><rect class="basic label-container" style="" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>SIEM Consumer<br />Forwards to Splunk / Datadog / ELK,<br />AWS CloudTrail, Azure Sentinel,<br />retry on failure (3x)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>