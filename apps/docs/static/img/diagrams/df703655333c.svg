bel" data-id="L_ca_ca_0" transform="translate(-100, -24)"><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>timeout -&gt; new CANDIDATE</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-fo-0" data-look="classic" transform="translate(196, 128.75)"><rect class="basic label-container" style="" x="-162" y="-73" width="324" height="146"/><g class="label" style="" transform="translate(-160, -72)"><rect/><foreignObject width="320" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 320px; text-align: center; width: 320px;"><span class="nodeLabel"><p></p><div style="text-align:left">FOLLOWER<br />Receives AppendEntries from leader, stays follower<br />Receives RequestVote, votes once per term<br />Starts election on timeout</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-ca-1" data-look="classic" transform="translate(772, 128.75)"><rect class="basic label-container" style="" x="-162" y="-97" width="324" height="194"/><g class="label" style="" transform="translate(-160, -96)"><rect/><foreignObject width="320" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 320px; text-align: center; width: 320px;"><span class="nodeLabel"><p></p><div style="text-align:left">CANDIDATE<br />Increments term, votes for self<br />Sends RequestVote to all nodes<br />Wins election -&gt; Leader<br />Loses election -&gt; Follower (higher term)<br />Split vote -&gt; new election (randomized timeout)</div><p></p></span></div></foreignObject></g></g><g class="label edgeLabel" id="ca---ca---1" transform="translate(986.0500000007451, 94.75)"><rect w