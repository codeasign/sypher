">LEADER<br />Receives all client requests<br />Appends entries to log, broadcasts to followers<br />Tracks quorum, commits entries<br />Sends periodic heartbeats to maintain authority<br />Steps down on higher term discovery</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-tr-5" data-look="classic" transform="translate(572, 138.5)"><rect class="basic label-container" style="" x="-162" y="-61" width="324" height="122"/><g class="label" style="" transform="translate(-160, -60)"><rect/><foreignObject width="320" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 320px; text-align: center; width: 320px;"><span class="nodeLabel"><p>Transitions:<br />Follower -&gt; Candidate -&gt; Leader -&gt; Follower<br />(no direct Follower -&gt; Leader or Leader -&gt; Candidate)</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(10.5, 35.5)"><g class="clusters"><g class="cluster" id="my-svg-R1" data-look="classic"><rect style="" x="8" y="-3" width="1256.2000000029802" height="241.5"/><g class="cluster-label" transform="translate(636.1000000014901, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M358,109.625L379,107.146C400,104.667,442,99.708,483.338,99.63C524.676,99.552,565.352,104.354,585.69,106.755L606.028,109.156" id="my-svg-L_fo_ca_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_fo_ca_0" data-points="W3sieCI6MzU4LCJ5IjoxMDkuNjI1fSx7IngiOjQ4NCwieSI6OTQuNzV9LHsieCI6NjEwLCJ5IjoxMDkuNjI1fV0=" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/><path d="M610,147.875L589,150.354C568,152.833,526,157.792,484