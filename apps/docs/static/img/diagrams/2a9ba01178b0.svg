 white-space: break-spaces; line-height: 1.5; max-width: 320px; text-align: center; width: 320px;"><span class="nodeLabel"><p>Considerations:<br />- Transaction size limit: stay under 1000 rows<br />- Lock escalation: short transactions prevent table locks<br />- Deadlocks possible: use deterministic statement ordering<br />- Connection pool: dedicate 5-10 connections for flusher</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>