label" style="" transform="translate(-210.9375, -36)"><rect/><foreignObject width="421.875" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Server A → smallest seq → LEADER<br />Server B → watches node-0000000001 → FOLLOWER<br />Server C → watches node-0000000002 → FOLLOWER</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(10.5, 48)"><g class="clusters"><g class="cluster" id="my-svg-IS" data-look="classic"><rect style="" x="8" y="-3" width="615.625" height="341"/><g class="cluster-label" transform="translate(250.1875, 1)"><foreignObject width="131.25" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Initial state:</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-S1-0" data-look="classic" transform="translate(315.8125, 178.5)"><rect class="basic label-container" style="" x="-297.3125" y="-121" width="594.625" height="242"/><g class="label" style="" transform="translate(-295.3125, -120)"><rect/><foreignObject width="590.625" height="240"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Server A  ──create(/election/node-)──►  ZooKeeper<br />Returns: /election/node-0000000001      returns seq 0000000001<br /><br />Server B  ──create(/election/node-)──►  ZooKeeper<br />Returns: /election/node-0000000002      returns seq 0000000002<br />Server B  ──exists(/election/node-0000000001, watch=true)──► ZK<br /><br />Server C  ──create(/election/node-)──►  ZooKeeper<br />Returns: /election/node-0000000003      returns seq 0000000003<br />Server C  ──exists(/election/node-0000000002, watch=true)──► ZK</div><p></p></span></div></foreignObject></g></g></g></g></g></g><g class="root" transform="translate(677.125, 32.5)"><g class="clusters"><g class="cluster" id="my-svg-C2" data-look="classic"><rect style="" x="8" y="-3" width="496" height="688"/><g class="cluster-label" transform="translate(256, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M256,434L256,438.333C256,442.667,256,451.333,256,460C256,468.667,256,477.333,256,481.667L256,486" id="my-svg-L_FO_RJ_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_FO_RJ_0" data-points="W3sieCI6MjU2LCJ5Ijo0MzR9LHsieCI6MjU2LCJ5Ijo0NjB9LHsieCI6MjU2LCJ5Ijo0ODZ9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_FO_RJ_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(10.5, 489)"><g class="clusters"><g class="cluster" id="my-svg-RJ" data-look="classic"><rect style="" x="8" y="-3" width="475" height="173"/><g class="cluster-label" transform="translate(48.625, 1)"><foreignObject width="393.75" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Re-joining behavior (Server A reconnects):</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-S4-5" data-look="classic" transform="translate(245.5, 94.5)"><rect class="basic label-container" style="" x="-227" y="-37" width="454" height="74"/><g class="label" style="" transform="translate(-225, -36)"><rect/><foreignObject width="450" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">7. Server A creates /election/node-0000000004<br />8. Server A watches node-0000000004 (no<br />   smaller node besides self) → becomes FOLLOWER</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(24.5625, 48)"><g class="clusters"><g class="cluster" id="my-svg-FO" data-look="classic"><rect style="" x="8" y="-3" width="446.875" height="389"/><g class="cluster-label" transform="translate(100.1875, 1)"><foreignObject width="262.5" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Failover (Server A crashes):</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-S3-4" data-look="classic" transform="translate(231.4375, 202.5)"><rect class="basic label-container" style="" x="-212.9375" y="-145" width="425.875" height="290"/><g class="label" style="" transform="translate(-210.9375, -144)"><rect/><foreignObject width="421.875" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">1. Server A's session times out (no heartbeat<br />   to ZooKeeper)<br />2. ZooKeeper deletes ephemeral<br />   /election/node-0000000001<br />3. ZooKeeper notifies Server B (watcher on<br />   node-0000000001)<br />4. Server B lists children of /election →<br />   [node-0000000002, node-0000000003]<br />5. Server B determines node-0000000002 is<br />   smallest → becomes leader<br />6. Server C updates its watch to<br />   node-0000000002</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>