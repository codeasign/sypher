 sharded by user_id, co-located with users table</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-QY-1" data-look="classic" transform="translate(316.1875, 406)"><rect class="basic label-container" style="" x="-250.375" y="-68" width="500.75" height="136"/><g class="label" style="" transform="translate(-234.375, -60)"><rect/><foreignObject width="468.75" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Query: SELECT * FROM users u JOIN orders_by_user o<br />       ON u.user_id = o.user_id WHERE u.user_id=42<br />-&gt; Router: hash(42)%4 = shard 0<br />-&gt; Shard 0: local join, both tables on same shard<br />-&gt; 1 shard hit, under 10ms</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(713.875, 58)"><g class="clusters"><g class="cluster" id="my-svg-RG" data-look="classic"><rect style="" x="8" y="-3" width="625.25" height="500"/><g class="cluster-label" transform="translate(320.625, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M275.625,258L283.125,258C290.625,258,305.625,258,320.625,258C335.625,258,350.625,258,358.125,258L365.625,258" id="my-svg-L_S0_S1_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_S0_S1_0" data-points="W3sieCI6Mjc1LjYyNSwieSI6MjU4fSx7IngiOjMyMC42MjUsInkiOjI1OH0seyJ4IjozNjUuNjI1LCJ5IjoyNTh9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_S0_S1_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg