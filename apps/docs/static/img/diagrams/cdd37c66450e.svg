ignObject></g></g></g></g><g class="root" transform="translate(4.6875, 22)"><g class="clusters"><g class="cluster" id="my-svg-DY" data-look="classic"><rect style="" x="8" y="-3" width="777.875" height="271"/><g class="cluster-label" transform="translate(321.9375, 1)"><foreignObject width="150" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>DynamoDB (PA/EL)</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-d1-0" data-look="classic" transform="translate(133.375, 143.5)"><rect class="basic label-container" style="" x="-100.375" y="-92" width="200.75" height="184"/><g class="label" style="" transform="translate(-84.375, -84)"><rect/><foreignObject width="168.75" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left">Normal (Else)<br />Write to 1 replica<br />Respond to client:<br />"saved" in 3ms<br />Async propagate:<br />replicas converge<br />in ~100ms</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-d2-1" data-look="classic" transform="translate(387.5625, 143.5)"><rect class="basic label-container" style="" x="-123.8125" y="-68" width="247.625" height="136"/><g class="label" style="" transform="translate(-107.8125, -60)"><rect/><foreignObject width="215.625" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left">Partition<br />Both sides accept<br />writes<br />Data may diverge<br />LWW conflict resolution</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchar