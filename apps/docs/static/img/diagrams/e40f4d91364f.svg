08,364.333,208C374.5,208,384,208,388.75,208L393.5,208" id="my-svg-L_s3_s4_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_s3_s4_0" data-points="W3sieCI6MzMyLjUsInkiOjIwOH0seyJ4IjozNjUsInkiOjIwOH0seyJ4IjozOTcuNSwieSI6MjA4fV0=" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/><path d="M689.5,208L694.917,208C700.333,208,711.167,208,721.333,208C731.5,208,741,208,745.75,208L750.5,208" id="my-svg-L_s4_s5_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_s4_s5_0" data-points="W3sieCI6Njg5LjUsInkiOjIwOH0seyJ4Ijo3MjIsInkiOjIwOH0seyJ4Ijo3NTQuNSwieSI6MjA4fV0=" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_s3_s4_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_s4_s5_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-s3-7" data-look="classic" transform="translate(186.5, 208)"><rect class="basic label-container" style="" x="-146" y="-164" width="292" height="328"/><g class="label" style="" transform="translate(-130, -156)"><rect/><foreignObject width="260" height="312"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p></p><div style="text-align:left"><b>Step 4: Application Accept</b><br />[PostgreSQL read / write system call]<br />──&gt; 1. accept() returns new fd<br />   2. Read query bytes from socket<br />   3. Parse query string (lexer + parser)<br />   4. Abstract syntax tree built<br />   Latency: 2-10 microseconds (parse)</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-s4-8" data-look="classic" transform="translate(543.5, 208)"><rect class="basic label-container" style="" x="-146" y="-164" width="292" height="328"/><g class="label" style="" transform="translate(-130, -156)"><rect/><foreignObject width="260" height="312"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p></p><div style="text-align:left"><b>Step 5: Query Planning</b><br />[Query Planner (PostgreSQL)]<br />──&gt; 1. Check pg_statistic (table stats)<br />   2. Estimate row counts for each join plan<br />   3. Choose cheapest plan by cost estimate<br />   4. Generate plan tree<br />   Latency: 10-100 microseconds (simple)<br />   5-50ms (complex join)</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-s5-9" data-look="classic" transform="translate(900.5, 208)"><rect class="basic label-container" style="" x="-146" y="-164" width="292" height="328"/><g class="label" style="" transform="translate(-130, -156)"><rect/><foreignObject width="260" height="312"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p></p><div style="text-align:left"><b>Step 6: Lock Acquisition</b><br />[Lock Manager (PostgreSQL)]<br />──&gt; 1. Acquire RowExclusiveLock on table<br />   2. Acquire RowShareLock on index pages<br />   3. Wait if conflicting lock held<br />   Latency: 0.5-5 microseconds (no contention)<br />   1ms-60s (contention — blocked)</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(0, 22)"><g class="clusters"><g class="cluster" id="my-svg-sR0" data-look="classic"><rect style="" x="8" y="-3" width="1071" height="376"/><g class="cluster-label" transform="translate(543.5, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M332.5,196L337.917,196C343.333,196,354.167,196,364.333,196C374.5,196,384,196,388.75,196L393.5,196" id="my-svg-L_s0_s1_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_s0_s1_0" data-points="W3sieCI6MzMyLjUsInkiOjE5Nn0seyJ4IjozNjUsInkiOjE5Nn0seyJ4IjozOTcuNSwieSI6MTk2fV0=" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/><path d="M689.5,196L694.917,196C700.333,196,711.167,196,721.333,196C731.5,196,741,196,745.75,196L750.5,196" id="my-svg-L_s1_s2_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_s1_s2_0" data-points="W3sieCI6Njg5LjUsInkiOjE5Nn0seyJ4Ijo3MjIsInkiOjE5Nn0seyJ4Ijo3NTQuNSwieSI6MTk2fV0=" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_s0_s1_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_s1_s2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-s0-0" data-look="classic" transform="translate(186.5, 196)"><rect class="basic label-container" style="" x="-146" y="-140" width="292" height="280"/><g class="label" style="" transform="translate(-130, -132)"><rect/><foreignObject width="260" height="264"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p></p><div style="text-align:left"><b>Step 1: Network Receive</b><br />[NIC receives packet]<br />──&gt; Client request arrives at NIC (Network Interface Card)<br />   DMA transfer to kernel ring buffer<br />   Latency: 0.1-1 microseconds<br />   (depends on packet size and link speed)</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-s1-1" data-look="classic" transform="translate(543.5, 196)"><rect class="basic label-container" style="" x="-146" y="-128" width="292" height="256"/><g class="label" style="" transform="translate(-130, -120)"><rect/><foreignObject width="260" height="240"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p></p><div style="text-align:left"><b>Step 2: IRQ / Softirq</b><br />[NIC raises IRQ]<br />──&gt; CPU core (pinned by RPS/irqbalance):<br />   1. Acknowledge interrupt<br />   2. Raise softirq (NET_RX_SOFTIRQ)<br />   3. Return from interrupt<br />   Latency: 2-5 microseconds</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-s2-2" data-look="classic" transform="translate(900.5, 196)"><rect class="basic label-container" style="" x="-146" y="-152" width="292" height="304"/><g class="label" style="" transform="translate(-130, -144)"><rect/><foreignObject width="260" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p></p><div style="text-align:left"><b>Step 3: Network Stack</b><br />[Kernel TCP/IP processing]<br />──&gt; 1. IP routing table lookup<br />   2. TCP reassembly (if fragmented)<br />   3. Socket lookup (find the listening process)<br />   4. Copy data to userspace buffer<br />   Latency: 5-20 microseconds</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>