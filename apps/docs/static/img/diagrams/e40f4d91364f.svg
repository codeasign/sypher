bel{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .root .anchor path{fill:#7E93A8!important;stroke-width:0;stroke:#7E93A8;}#my-svg .arrowheadPath{fill:#f4f0eb;}#my-svg .edgePath .path{stroke:#7E93A8;stroke-width:1px;}#my-svg .flowchart-link{stroke:#7E93A8;fill:none;}#my-svg .edgeLabel{background-color:#0B0F14;text-align:center;}#my-svg .edgeLabel p{background-color:#0B0F14;}#my-svg .edgeLabel rect{opacity:0.5;background-color:#0B0F14;fill:#0B0F14;}#my-svg .labelBkg{background-color:rgba(11, 15, 20, 0.5);}#my-svg .cluster rect{fill:#101720;stroke:#33465C;stroke-width:1px;}#my-svg .cluster text{fill:#E8EEF5;}#my-svg .cluster span{color:#E8EEF5;}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace;font-size:12px;background:#221B2C;border:1px solid #A184D4;border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#E8EEF5;}#my-svg rect.text{fill:none;stroke-width:0;}#my-svg .icon-shape,#my-svg .image-shape{background-color:#0B0F14;text-align:center;}#my-svg .icon-shape p,#my-svg .image-shape p{background-color:#0B0F14;padding:2px;}#my-svg .icon-shape .label rect,#my-svg .image-shape .label rect{opacity:0.5;background-color:#0B0F14;fill:#0B0F14;}#my-svg .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#my-svg .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#my-svg .node .neo-node{stroke:#5EA3E6;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swi