s="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_Q1_Q2_0" data-points="W3sieCI6MjAzLCJ5IjoxNzEuNX0seyJ4IjoyMDMsInkiOjIwOX0seyJ4IjoyMDMsInkiOjI0Ni41fV0=" data-look="classic"/><path d="M203,372.5L203,378.75C203,385,203,397.5,203,410C203,422.5,203,435,203,441.25L203,447.5" id="my-svg-L_Q2_Q3_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_Q2_Q3_0" data-points="W3sieCI6MjAzLCJ5IjozNzIuNX0seyJ4IjoyMDMsInkiOjQxMH0seyJ4IjoyMDMsInkiOjQ0Ny41fV0=" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_Q1_Q2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_Q2_Q3_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-Q1-5" data-look="classic" transform="translate(203, 108.5)"><rect class="basic label-container" style="" x="-160" y="-63" width="320" height="126"/><g class="label" style="" transform="translate(-130, -48)"><rect/><foreignObject width="260" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>Extra O(n) memory OK? Yes -&gt; auxiliary structures (hash maps, stacks, linked lists). No -&gt; in-place updates (array indices, pointers).</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Q2-6" data-look="classic" transform="translate(203, 309.5)"><rect class="basic label-container" style="" x="-160" y="-63" width="320" height="126"/><g class="label" style="" transform="translate(-130, -48)"><rect/><foreignObject width="260" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>O(1) time required for all ops? Yes -&gt; combine complementary structures (hash map + list). No -&gt; simpler structure, accept O(log n).</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Q3-7" data-look="classic" transform="translate(203, 498.5)"><rect class="basic label-container" style="" x="-160" y="-51" width="320" height="102"/><g class="label" style="" transform="translate(-130, -36)"><rect/><foreignObject width="260" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>Constant space required? Yes -&gt; array w/ direct indexing. No -&gt; hash maps, linked lists.</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(29.2265625, 0)"><g class="clusters"><g class="cluster" id="my-svg-TableCol" data-look="classic"><rect style="" x="8" y="8" width="331.546875" height="780"/><g class="cluster-label" transform="translate(83.1640625, 8)"><foreignObject width="181.21875" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Design Pattern Trade-offs</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-T1-0" data-look="classic" transform="translate(173.7734375, 94)"><rect class="basic label-container" style="" x="-125.90625" y="-51" width="251.8125" height="102"/><g class="label" style="" transform="translate(-95.90625, -36)"><rect/><foreignObject width="191.8125" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>Min Stack<br />push/pop/top/getMin O(1)<br />Stack + min-tracking stack</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T2-1" data-look="classic" transform="translate(173.7734375, 246)"><rect class="basic label-container" style="" x="-114.96875" y="-51" width="229.9375" height="102"/><g class="label" style="" transform="translate(-84.96875, -36)"><rect/><foreignObject width="169.9375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>LRU Cache<br />get/put O(1), evict LRU<br />HashMap + DLL</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T3-2" data-look="classic" transform="translate(173.7734375, 398)"><rect class="basic label-container" style="" x="-115.296875" y="-51" width="230.59375" height="102"/><g class="label" style="" transform="translate(-85.296875, -36)"><rect/><foreignObject width="170.59375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>LFU Cache<br />get/put O(1), evict LFU<br />HashMap + freq buckets</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T4-3" data-look="classic" transform="translate(173.7734375, 550)"><rect class="basic label-container" style="" x="-128.2734375" y="-51" width="256.546875" height="102"/><g class="label" style="" transform="translate(-98.2734375, -36)"><rect/><foreignObject width="196.546875" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>HashMap<br />put/get/del O(1) avg<br />Array + chaining/open addr</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T5-4" data-look="classic" transform="translate(173.7734375, 702)"><rect class="basic label-container" style="" x="-115.890625" y="-51" width="231.78125" height="102"/><g class="label" style="" transform="translate(-85.890625, -36)"><rect/><foreignObject width="171.78125" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>Browser History<br />visit/back/forward O(1)<br />Two stacks / DLL</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>