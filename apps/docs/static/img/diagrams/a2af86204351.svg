356" id="my-svg-L_GS_kf_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_GS_kf_0" data-points="W3sieCI6OTA1Ljg3NSwieSI6MzU2fSx7IngiOjkyMC4zNzUsInkiOjM1Nn0seyJ4Ijo5MzQuODc1LCJ5IjozNTZ9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_in_GR_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_GR_GS_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_GS_kf_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(548.875, 46)"><g class="clusters"><g class="cluster" id="my-svg-GS" data-look="classic"><rect style="" x="8" y="-3" width="349" height="626"/><g class="cluster-label" transform="translate(182.5, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M155.5,321L160,321C164.5,321,173.5,321,182.5,321C191.5,321,200.5,321,205,321L209.5,321" id="my-svg-L_g3_g4_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_g3_g4_0" data-points="W3sieCI6MTU1LjUsInkiOjMyMX0seyJ4IjoxODIuNSwieSI6MzIxfSx7IngiOjIwOS41LCJ5IjozMjF9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_g3_g4_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-g3-5" data-look="classic" transform="translate(95.25, 321)"><rect class="basic label-container" style="" x="-60.25" y="-254" width="120.5" height="508"/><g class="label" style="" transform="translate(-56.25, -252)"><rect/><foreignObject width="112.5" height="504"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 110px; text-align: center; width: 110px;"><span class="nodeLabel"><p>Storage Backends (stevedores)<br />- malloc: in-memory storage, uses LRU<br />- file: mmap-based file storage, uses LRU<br />- persistent: file-based with crash recovery<br />- Each backend manages its own eviction</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-g4-6" data-look="classic" transform="translate(269.75, 321)"><rect class="basic label-container" style="" x="-60.25" y="-290" width="120.5" height="580"/><g class="label" style="" transform="translate(-56.25, -288)"><rect/><foreignObject width="112.5" height="576"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 110px; text-align: center; width: 110px;"><span class="nodeLabel"><p>Purge API (manual eviction)<br />- Ban: invalidates objects matching a pattern (regex)<br />- Purge: removes a specific URL<br />- Hard purge: immediately removes object from storage<br />- Soft purge: marks as expired but keeps for grace/age</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-in-0" data-look="classic" transform="translate(82.75, 356)"><rect class="basic label-container" style="" x="-60.25" y="-170" width="120.5" height="340"/><g class="label" style="" transform="translate(-56.25, -168)"><rect/><foreignObject width="112.5" height="336"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 110px; text-align: center; width: 110px;"><span class="nodeLabel"><p>Varnish uses a two-tier eviction system: TTL-based expiration<br />(primary) and LRU eviction (secondary, when storage is full).</p></span></div></foreignObject></g></g><g class="root" transform="translate(164, 34)"><g class="clusters"><g class="cluster" id="my-svg-GR" data-look="classic"><rect style="" x="8" y="-3" width="355.875" height="650"/><g class="cluster-label" transform="translate(185.9375, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M164.875,333L169.375,333C173.875,333,182.875,333,191.875,333C200.875,333,209.875,333,214.375,333L218.875,333" id="my-svg-L_g1_g2_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_g1_g2_0" data-points="W3sieCI6MTY0Ljg3NSwieSI6MzMzfSx7IngiOjE5MS44NzUsInkiOjMzM30seyJ4IjoyMTguODc1LCJ5IjozMzN9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_g1_g2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-g1-1" data-look="classic" transform="translate(99.9375, 333)"><rect class="basic label-container" style="" x="-64.9375" y="-302" width="129.875" height="604"/><g class="label" style="" transform="translate(-60.9375, -300)"><rect/><foreignObject width="121.875" height="600"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 110px; text-align: center; width: 110px;"><span class="nodeLabel"><p>TTL Expiration (primary)<br />- Each object has a TTL from Cache-Control header<br />- Expired objects are moved to a cleanup list<br />- A background thread periodically frees expired objects<br />- No TTL = object is cached until LRU eviction or purge</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-g2-2" data-look="classic" transform="translate(277.875, 333)"><rect class="basic label-container" style="" x="-59" y="-302" width="118" height="604"/><g class="label" style="" transform="translate(-55, -300)"><rect/><foreignObject width="110" height="600"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 110px; text-align: center; width: 110px;"><span class="nodeLabel"><p>LRU Eviction (secondary)<br />- When storage is full, the LRU object is evicted<br />- Varnish maintains a global LRU list of all objects<br />- Objects are moved to the LRU head on each access<br />- The LRU tail is evicted when storage is full</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-kf-9" data-look="classic" transform="translate(999.8125, 356)"><rect class="basic label-container" style="" x="-64.9375" y="-242" width="129.875" height="484"/><g class="label" style="" transform="translate(-60.9375, -240)"><rect/><foreignObject width="121.875" height="480"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 110px; text-align: center; width: 110px;"><span class="nodeLabel"><p>Key features:<br />- Grace mode: serve stale content while revalidating in background<br />- Saint mode: mark backend as unhealthy if it serves errors<br />- Hit-for-pass: cache the fact that a URL is uncacheable</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>