ata-look="classic" transform="translate(335.875, 245.5)"><rect class="basic label-container" style="" x="-313.375" y="-146" width="626.75" height="292"/><g class="label" style="" transform="translate(-309.375, -144)"><rect/><foreignObject width="618.75" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Time   Event<br />────── ───────────────────────────────────────────────────────────<br />0.0s   Node 3 is leader, term 7<br />0.3s   Node 3 pauses for GC (200ms) → followers timeout<br />0.5s   Node 1 elected leader, term 8<br />0.7s   Node 3 returns from GC, sees term 8, steps down<br />1.2s   Node 1 pauses for GC (150ms) → followers timeout<br />1.4s   Node 2 elected leader, term 9<br />1.6s   Node 1 returns, steps down<br />2.0s   Node 2 pauses for GC (250ms) → followers timeout<br />2.3s   Node 3 elected leader, term 10<br />...    (pattern repeats)</div><p></p></span></div></foreignObject></g></g><g class="root" transform="translate(670.25, 47)"><g class="clusters"><g class="cluster" id="my-svg-IM" data-look="classic"><rect style="" x="8" y="-3" width="683.875" height="403"/><g class="cluster-label" transform="translate(317.125, 1)"><foreignObject width="65.625" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Impact:</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="root" transform="translate(27, 47)"><g class="clusters"><g class="cluster" id="my-svg-MI" data-look="classic"><rect style="" x="8" y="-3" width="629.875" height="201"/><g class="cluster-label" transform="translate(271.375, 1)"><foreignObject width="103.125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Mitigation:</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-MT-2" data-look="classic" transform="translate(322.9375, 108.5)"><rect class="basic label-container" style="" x="-289.9375" y="-50" width="579.875" height="100"/><g class="label" style="" transform="translate(-285.9375, -48)"><rect/><foreignObject width="571.875" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">- Increase heartbeat interval to tolerate GC pauses<br />- Enable pre-vote to prevent stale candidates from disrupting<br />- Tune GC to avoid stop-the-world pauses<br />- Use dedicated CPU instances (no CPU stealing)</div><p></p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-IP-1" data-look="classic" transform="translate(349.9375, 325)"><rect class="basic label-container" style="" x="-247.75" y="-50" width="495.5" height="100"/><g class="label" style="" transform="translate(-243.75, -48)"><rect/><foreignObject width="487.5" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">- Write throughput drops by 80% during each election<br />- Log synchronization overhead<br />- Client connection rebalancing<br />- Monitoring alerts fire repeatedly</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>