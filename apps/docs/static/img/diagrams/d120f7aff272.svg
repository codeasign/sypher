ign: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-D1-1" data-look="classic" transform="translate(339.25, 81.5)"><rect class="basic label-container" style="" x="-320.75" y="-49" width="641.5" height="98"/><g class="label" style="" transform="translate(-318.75, -48)"><rect/><foreignObject width="637.5" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Default (10 worker bits, 12 sequence bits):<br />┌─────────┬─────────────────────────────────┬──────────┬───────────┐<br />│ 1 sign  │ 41-bit timestamp (69 years)     │ 10 wkr   │ 12 seq    │<br />│         │                                 │ (1024)   │ (4096/ms) │</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-D2-2" data-look="classic" transform="translate(339.25, 206.5)"><rect class="basic label-container" style="" x="-320.75" y="-49" width="641.5" height="98"/><g class="label" style="" transform="translate(-318.75, -48)"><rect/><foreignObject width="637.5" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">High-throughput (10 worker bits, 14 sequence bits):<br />┌─────────┬───────────────────────────────┬──────────┬─────────────┐<br />│ 1 sign  │ 39-bit timestamp (17 years)   │ 10 wkr   │ 14 seq      │<br />│         │                               │ (1024)   │(16384/ms)   │</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-D3-3" data-look="classic" transform="translate(339.25, 331.5)"><rect class="basic label-container" style="" x="-320.75" y="-49" width="641.5" height="98"/><g class="label" style="" transform="translate(-318.75, -48)"><rect/><foreignObject width="637.5" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Large-cluster (12 worker bits, 10 sequence bits):<br />┌─────────┬───────────────────────────────┬──────────┬─────────────┐<br />│ 1 sign  │ 41-bit timestamp (69 years)   │ 12 wkr   │ 10 seq      │<br />│         │                               │ (4096)   │ (1024/ms)   │</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-NT-4" data-look="classic" transform="translate(339.25, 444.5)"><rect class="basic label-container" style="" x="-269.1875" y="-37" width="538.375" height="74"/><g class="label" style="" transform="translate(-267.1875, -36)"><rect/><foreignObject width="534.375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Total must always equal 64 bits (63 usable).<br />(timestamp + worker + sequence) = 63<br />Every bit borrowed from one field must come from another.</div><p></p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-ti-0" data-look="classic" transform="translate(56.875, 268)"><rect class="basic label-container" style="" x="-48.875" y="-25" width="97.75" height="50"/><g class="label" style="" transform="translate(-46.875, -24)"><rect/><foreignObject width="93.75" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>BIT BUDGET<br />TRADE-OFFS</p></span></div></foreignObject></g></g></g></g></g><defs><filter id