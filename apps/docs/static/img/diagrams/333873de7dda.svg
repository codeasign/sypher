reignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_S5_C_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-S1-0" data-look="classic" transform="translate(338, 83)"><rect class="basic label-container" style="" x="-165.9375" y="-75" width="331.875" height="150"/><g class="label" style="" transform="translate(-135.9375, -60)"><rect/><foreignObject width="271.875" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>① Client generates code_verifier = random 43-char string<br />code_challenge = base64(sha256(code_verifier))</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S2-2" data-look="classic" transform="translate(338, 259)"><rect class="basic label-container" style="" x="-330" y="-51" width="660" height="102"/><g class="label" style="" transform="translate(-300, -36)"><rect/><foreignObject width="600" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>② Authorization Request includes:<br />GET /authorize?response_type=code&amp;code_challenge=...&amp;code_challenge_method=S256</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S3-4" data-look="classic" transform="translate(338, 435)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>③ Auth Server stores code_challenge, returns authorization code as usual</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S4-6" data-look="classic" transform="translate(338, 611)"><rect class="basic label-container" style="" x="-203.4375" y="-51" width="406.875" height="102"/><g class="label" style="" transform="translate(-173.4375, -36)"><rect/><foreignObject width="346.875" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>④ Token Request includes: POST /token, code_verifier=original_43_char_string</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S5-8" data-look="classic" transform="translate(338, 811)"><rect class="basic label-container" style="" x="-137.8125" y="-99" width="275.625" height="198"/><g class="label" style="" transform="translate(-107.8125, -84)"><rect/><foreignObject width="215.625" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>⑤ Auth Server applies sha256(code_verifier), compares to stored code_challenge<br />Match: issue tokens. No match: reject request</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-10" data-look="classic" transform="translate(338, 1071)"><rect class="basic label-container" style="" x="-130" y="-111" widt