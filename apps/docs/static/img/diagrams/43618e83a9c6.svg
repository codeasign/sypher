; text-align: center; width: 200px;"><span class="nodeLabel"><p>Global DNS (Latency-Based Routing)<br />US East -&gt; us-east-1.auth.example.com (35ms p50)<br />EU West -&gt; eu-west-1.auth.example.com (45ms p50)<br />AP SE -&gt; ap-southeast-1.auth.example.com (120ms p50)<br />SA East -&gt; sa-east-1.auth.example.com (150ms p50)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R1-1" data-look="classic" transform="translate(448, 83)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>US-East<br />RateLimiter-&gt;AuthCluster(20)-&gt;SessionStore(3+3)-&gt;UserStore Primary</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R2-3" data-look="classic" transform="translate(448, 283)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>EU-West<br />RateLimiter-&gt;AuthCluster(15)-&gt;SessionStore(3+3)-&gt;UserStore Replica</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R3-5" data-look="classic" transform="translate(448, 483)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-hei