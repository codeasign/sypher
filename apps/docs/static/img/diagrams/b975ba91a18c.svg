bject></g></g></g></g><g class="root" transform="translate(20.5, 35)"><g class="clusters"><g class="cluster" id="my-svg-S1" data-look="classic"><rect style="" x="8" y="-3" width="578" height="200"/><g class="cluster-label" transform="translate(198.5625, 1)"><foreignObject width="196.875" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Load vector from disk</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-S1n-2" data-look="classic" transform="translate(297, 108)"><rect class="basic label-container" style="" x="-276" y="-56" width="552" height="112"/><g class="label" style="" transform="translate(-260, -48)"><rect/><foreignObject width="520" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 520px; text-align: center; width: 520px;"><span class="nodeLabel"><p>Problem: 1M × 3KB random reads = 3GB of disk I/O per query<br />Even on NVMe SSD (3.5GB/s read): ~1 second per query.<br />On HDD (100MB/s): ~30 seconds. Unusable.</p></span></div></foreignObject></g></g></g></g></g></g><g class="root" transform="translate(252.25, 22)"><g class="clusters"><g class="cluster" id="my-svg-R0" data-look="classic"><rect style="" x="8" y="-3" width="733.5" height="103"/><g class="cluster-label" transform="translate(374.75, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-SS-0" data-look="classic" transform="translate(252.625, 59.5)"><rect class="basic label-container" style="" x="-231.625" y="-20" width="463.25" height="40"/><g class="labe