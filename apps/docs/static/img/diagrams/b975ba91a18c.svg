 results, keep top_k</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-S3n-6" data-look="classic" transform="translate(297, 96)"><rect class="basic label-container" style="" x="-276" y="-44" width="552" height="88"/><g class="label" style="" transform="translate(-260, -36)"><rect/><foreignObject width="520" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 520px; text-align: center; width: 520px;"><span class="nodeLabel"><p>Problem: Sorting 1M floats takes O(n log n) = 20M comparisons.<br />Adds 10-20ms per query on top of everything else.</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-TT-8" data-look="classic" transform="translate(923.5, 120)"><rect class="basic label-container" style="" x="-276" y="-44" width="552" height="88"/><g class="label" style="" transform="translate(-260, -36)"><rect/><foreignObject width="520" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 520px; text-align: center; width: 520px;"><span class="nodeLabel"><p>Total: 50-100ms per query at best (in-memory, SIMD)<br />At 100 QPS: 100 concurrent queries would need 5-10 cores just for search.</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(0, 141)"><g class="clusters"><g class="cluster" id="my-svg-R1" data-look="classic"><rect style="" x="8" y="-3" width="1238" height="248"/><g class="cluster-label" transform="translate(627, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M606.5,132L609.917,132C613.333,132,620.167,132,626.333,132C632.5,132,638,132,640.75,1