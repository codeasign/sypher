<svg id="my-svg" width="1336" height="859" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 1336px; background-color: rgb(11, 15, 20);" viewBox="0 0 1336 859" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#my-svg{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace;font-size:16px;fill:#E8EEF5;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#221B2C;}#my-svg .error-text{fill:#EADFFF;stroke:#EADFFF;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#7E93A8;stroke:#7E93A8;}#my-svg .marker.cross{stroke:#7E93A8;}#my-svg svg{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace;font-size:16px;}#my-svg p{margin:0;}#my-svg .label{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace;color:#E8EEF5;}#my-svg .cluster-label text{fill:#E8EEF5;}#my-svg .cluster-label span{color:#E8EEF5;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#E8EEF5;color:#E8EEF5;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#16202C;stroke:#5EA3E6;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .root .anchor path{fill:#7E93A8!important;stroke-width:0;stroke:#7E93A8;}#my-svg .arrowheadPath{fill:#f4f0eb;}#my-svg .edgePath .path{stroke:#7E93A8;stroke-width:1px;}#my-svg .flowchart-link{stroke:#7E93A8;fill:none;}#my-svg .edgeLabel{background-color:#0B0F14;text-align:center;}#my-svg .edgeLabel p{background-color:#0B0F14;}#my-svg .edgeLabel rect{opacity:0.5;background-color:#0B0F14;fill:#0B0F14;}#my-svg .labelBkg{background-color:rgba(11, 15, 20, 0.5);}#my-svg .cluster rect{fill:#101720;stroke:#33465C;stroke-width:1px;}#my-svg .cluster text{fill:#E8EEF5;}#my-svg .cluster span{color:#E8EEF5;}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace;font-size:12px;background:#221B2C;border:1px solid #A184D4;border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#E8EEF5;}#my-svg rect.text{fill:none;stroke-width:0;}#my-svg .icon-shape,#my-svg .image-shape{background-color:#0B0F14;text-align:center;}#my-svg .icon-shape p,#my-svg .image-shape p{background-color:#0B0F14;padding:2px;}#my-svg .icon-shape .label rect,#my-svg .image-shape .label rect{opacity:0.5;background-color:#0B0F14;fill:#0B0F14;}#my-svg .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#my-svg .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#my-svg .node .neo-node{stroke:#5EA3E6;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#5EA3E6;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="my-svg_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointStart-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto"><polygon points="0,7 11.5,14 11.5,0" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-circleEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-circleStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="-1" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-circleEnd-margin" class="marker flowchart-v2" viewBox="0 0 10 10" refY="5" refX="12.25" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-circleStart-margin" class="marker flowchart-v2" viewBox="0 0 10 10" refX="-2" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-crossEnd" class="marker cross flowchart-v2" viewBox="0 0 11 11" refX="12" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 1,1 l 9,9 M 10,1 l -9,9" class="arrowMarkerPath" style="stroke-width: 2; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-crossStart" class="marker cross flowchart-v2" viewBox="0 0 11 11" refX="-1" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 1,1 l 9,9 M 10,1 l -9,9" class="arrowMarkerPath" style="stroke-width: 2; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-crossEnd-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5;"/></marker><marker id="my-svg_flowchart-v2-crossStart-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"/></marker><g class="root"><g class="clusters"/><g class="edgePaths"><path d="M668,376L668,378.917C668,381.833,668,387.667,668,392.833C668,398,668,402.5,668,404.75L668,407" id="my-svg-L_ROWA_ROWB_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_ROWA_ROWB_0" data-points="W3sieCI6NjY4LCJ5IjozNzZ9LHsieCI6NjY4LCJ5IjozOTMuNX0seyJ4Ijo2NjgsInkiOjQxMX1d" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_ROWA_ROWB_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(220, 403)"><g class="clusters"><g class="cluster" id="my-svg-ROWB" data-look="classic"><rect style="" x="8" y="8" width="880" height="440"/><g class="cluster-label" transform="translate(194.875, 8)"><foreignObject width="506.25" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Five Lessons from Production AI Observability (2 of 2)</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M418,228L423,228C428,228,438,228,448,228C458,228,468,228,473,228L478,228" id="my-svg-L_L4_L5_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_L4_L5_0" data-points="W3sieCI6NDE4LCJ5IjoyMjh9LHsieCI6NDQ4LCJ5IjoyMjh9LHsieCI6NDc4LCJ5IjoyMjh9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_L4_L5_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-L4-6" data-look="classic" transform="translate(228, 228)"><rect class="basic label-container" style="" x="-190" y="-135" width="380" height="270"/><g class="label" style="" transform="translate(-160, -120)"><rect/><foreignObject width="320" height="240"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 320px; text-align: center; width: 320px;"><span class="nodeLabel"><p>Lesson 4: Feedback Loops over Dashboards<br />Dashboards show what happened. Feedback loops tell you whether the result was good or bad. Invest in feedback loops early.<br /><br />Feedback types: human rating, automated eval, CI/CD regression, drift detection, cost anomaly</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L5-7" data-look="classic" transform="translate(668, 228)"><rect class="basic label-container" style="" x="-190" y="-195" width="380" height="390"/><g class="label" style="" transform="translate(-160, -180)"><rect/><foreignObject width="320" height="360"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 320px; text-align: center; width: 320px;"><span class="nodeLabel"><p>Lesson 5: Plan for Cost From Day One<br />LLM observability costs scale with LLM usage. A system costing 10 USD/month at 10K req/day costs 500 USD/month at 10M req/day. Plan sampling, retention, and storage tiering from the start.<br /><br />At 10K req/day: 10% sampling, 7-day retention, 15 USD/mo<br />At 1M req/day: 10% tail, 30-day raw, 90 sampled, 150/mo<br />At 10M req/day: 5% tail, 30-day raw, 90 sampled, 500/mo</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(0, 0)"><g class="clusters"><g class="cluster" id="my-svg-ROWA" data-look="classic"><rect style="" x="8" y="8" width="1320" height="368"/><g class="cluster-label" transform="translate(414.875, 8)"><foreignObject width="506.25" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Five Lessons from Production AI Observability (1 of 2)</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M418,192L423,192C428,192,438,192,448,192C458,192,468,192,473,192L478,192" id="my-svg-L_L1_L2_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_L1_L2_0" data-points="W3sieCI6NDE4LCJ5IjoxOTJ9LHsieCI6NDQ4LCJ5IjoxOTJ9LHsieCI6NDc4LCJ5IjoxOTJ9XQ==" data-look="classic"/><path d="M858,192L863,192C868,192,878,192,888,192C898,192,908,192,913,192L918,192" id="my-svg-L_L2_L3_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_L2_L3_0" data-points="W3sieCI6ODU4LCJ5IjoxOTJ9LHsieCI6ODg4LCJ5IjoxOTJ9LHsieCI6OTE4LCJ5IjoxOTJ9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_L1_L2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_L2_L3_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-L1-0" data-look="classic" transform="translate(228, 192)"><rect class="basic label-container" style="" x="-190" y="-159" width="380" height="318"/><g class="label" style="" transform="translate(-160, -144)"><rect/><foreignObject width="320" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 320px; text-align: center; width: 320px;"><span class="nodeLabel"><p>Lesson 1: Trace ID Propagation<br />The most important infrastructure decision is propagating trace IDs across all services. Without it, you cannot stitch together a complete trace.<br /><br />Do: Pass trace_id as HTTP header, message attribute, log context in every service<br />Don't: Generate new trace_id per service</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L2-1" data-look="classic" transform="translate(668, 192)"><rect class="basic label-container" style="" x="-190" y="-159" width="380" height="318"/><g class="label" style="" transform="translate(-160, -144)"><rect/><foreignObject width="320" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 320px; text-align: center; width: 320px;"><span class="nodeLabel"><p>Lesson 2: Sampling is a Feature, Not a Bug<br />Sampling reduces costs by 90% while still capturing the most important events. Intelligent sampling is better than no sampling.<br /><br />Always keep: errors, high-latency, unusual attributes<br />Sample: normal traces at 5-10% with tail-based strategy</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L3-2" data-look="classic" transform="translate(1108, 192)"><rect class="basic label-container" style="" x="-190" y="-135" width="380" height="270"/><g class="label" style="" transform="translate(-160, -120)"><rect/><foreignObject width="320" height="240"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 320px; text-align: center; width: 320px;"><span class="nodeLabel"><p>Lesson 3: Instrument Your Own Code, Not Just the LLM<br />A complete trace includes all steps: retrieval, guardrail, post-processing. Without this, you cannot determine the root cause.<br /><br />Span types: input, retrieval, prompt-build, LLM-call, guardrail, output, feedback</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>