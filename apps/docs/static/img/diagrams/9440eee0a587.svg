iewBox="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5;"/></marker><marker id="my-svg_flowchart-v2-crossStart-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"/></marker><g class="root"><g class="clusters"/><g class="edgePaths"><path d="M648.313,267L648.313,270.333C648.313,273.667,648.313,280.333,648.313,287C648.313,293.667,648.313,300.333,648.313,303.667L648.313,307" id="my-svg-L_TOP_SO_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_TOP_SO_0" data-points="W3sieCI6NjQ4LjMxMjUsInkiOjI2N30seyJ4Ijo2NDguMzEyNSwieSI6Mjg3fSx7IngiOjY0OC4zMTI1LCJ5IjozMDd9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_TOP_SO_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(380.875, 310)"><g class="clusters"><g class="cluster" id="my-svg-SO" data-look="classic"><rect style="" x="8" y="-3" width="518.875" height="376"/><g class="cluster-label" transform="translate(103.375, 1)"><foreignObject width="328.125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Solution: Distributed Rate Limiting</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-SOL-13" data-look="classic" transform="translate(267.4375, 196)"><rect class="basic label-container" style="" x="-226.9375" y="-152" width="453.875" height="304"/><g class="label" style="" transform="translate(-210.9375, -144)"><rect/><foreignObject width="421.875" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">1. Each server gets a local token bucket<br />   capacity = 2 RPS (100 global / 50 servers)<br /><br />2. Redis-backed global rate limiter<br />   Key: "ratelimit:payment_api"<br />   Sliding window: 100 requests per second<br />   Atomic increment with Lua script<br /><br />3. Circuit breaker: open after 10 failures<br />   in 30 seconds, recovery timeout 60s<br /><br />4. Fallback: queue payment for retry</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(0, 22)"><g class="clusters"><g class="cluster" id="my-svg-TOP" data-look="classic"><rect style="" x="8" y="-3" width="1280.625" height="248"/><g class="cluster-label" transform="translate(418.625, 1)"><foreignObject width="459.375" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>50 app servers each calling the same external API</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M756,132L761.417,132C766.833,132,777.667,132,788.5,132C799.333,132,810.167,132,815.583,132L821,132" id="my-svg-L_EX_PB_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_EX_PB_0" data-points="W3sieCI6NzU2LCJ5IjoxMzJ9LHsieCI6Nzg4LjUsInkiOjEzMn0seyJ4Ijo4MjEsInkiOjEzMn1d" data-look="classic"/><path d="M471.5,82.904L476.917,81.67C482.333,80.436,493.167,77.968,508.244,80.571C523.322,83.174,542.644,90.84