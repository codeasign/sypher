-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_a2_EX_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_a3_EX_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(32.5, 47)"><g class="clusters"><g class="cluster" id="my-svg-AS" data-look="classic"><rect style="" x="8" y="-3" width="431" height="176"/><g class="cluster-label" transform="translate(223.5, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-a1-0" data-look="classic" transform="translate(86.5, 96)"><rect class="basic label-container" style="" x="-53.5" y="-32" width="107" height="64"/><g class="label" style="" transform="translate(-37.5, -24)"><rect/><foreignObject width="75" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>App<br />Server 1</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-a2-1" data-look="classic" transform="translate(223.5, 96)"><rect class="basic label-container" style="" x="-53.5" y="-32" width="107" height="64"/><g class="label" style="" transform="translate(-37.5, -24)"><rect/><foreignObject width="75" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>App<br />Server 2</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-a3-2" data-look="classic" transform="translate(360.5, 96)"><rect class="basic label-container" style="" x="-53.5" y="-32" width="107" height="64"/><g class="label" style="" transform="translate(-37.5, -24)"><rect/><foreignObject width="75" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>App<br />Server 3</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-EX-3" data-look="classic" transform="translate(646.25, 132)"><rect class="basic label-container" style="" x="-109.75" y="-32" width="219.5" height="64"/><g class="label" style="" transform="translate(-93.75, -24)"><rect/><foreignObject width="187.5" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>External Payment API<br />Rate limit: 100 RPS</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-PB-4" data-look="classic" transform="translate(1038.5625, 132)"><rect class="basic label-container" style="" x="-217.5625" y="-44" width="435.125" height="88"/><g class="label" style="" transform="translate(-201.5625, -36)"><rect/><foreignObject width="403.125" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>Problem: 50 servers x 10 RPS each<br />= 500 RPS total, but API allows 100 RPS<br />= 80% of requests get 429 Too Many Requests</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>