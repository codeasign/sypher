lass="label" style="" transform="translate(-130, -84)"><rect/><foreignObject width="260" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>Configuration:<br />  maxmemory 4gb<br />  maxmemory-policy allkeys-lru<br />  maxmemory-samples 5<br />  maxmemory-eviction-tenacity 10  (Redis 7.0+)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-pf-8" data-look="classic" transform="translate(581, 148)"><rect class="basic label-container" style="" x="-146" y="-104" width="292" height="208"/><g class="label" style="" transform="translate(-130, -96)"><rect/><foreignObject width="260" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>Performance:<br />- Eviction is O(per-sample) : 5 comparisons per eviction<br />- At 100K keys: ~2 microseconds per eviction<br />- At 10M keys: ~10 microseconds per eviction</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-in-0" data-look="classic" transform="translate(606, 95.5)"><rect class="basic label-container" style="" x="-146" y="-44" width="292" height="88"/><g class="label" style="" transform="translate(-130, -36)"><rect/><foreignObject width="260" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>Redis eviction policies are organized into two groups:</p></span></div></foreignObject></g></g><g class="root" transform="translate(25, 207.5)"><g class="clusters"><g class="cluster" id="my-svg-G" data-look="classic"><rect style="" x="8" y="-3" width="1146" height="328"/><g class="cluster-label" transform="translate(581, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M345,172L352.5,172C360,172,375,172,390,172C405,172,420,172,427.5,172L435,172" id="my-svg-L_g1_g2_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_g1_g2_0" data-points="W3sieCI6MzQ1LCJ5IjoxNzJ9LHsieCI6MzkwLCJ5IjoxNzJ9LHsieCI6NDM1LCJ5IjoxNzJ9XQ==" data-look="classic"/><path d="M727,172L734.5,172C742,172,757,172,772,172C787,172,802,172,809.5,172L817,172" id="my-svg-L_g2_g3_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_g2_g3_0" data-points="W3sieCI6NzI3LCJ5IjoxNzJ9LHsieCI6NzcyLCJ5IjoxNzJ9LHsieCI6ODE3LCJ5IjoxNzJ9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_g1_g2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_g2_g3_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-g1-1" data-look="classic" transform="translate(199, 172)"><rect class="basic label-container" style="" x="-146" y="-128" width="292" height="256"/><g class="label" style="" transform="translate(-130, -120)"><rect/><foreignObject width="260" height="240"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>allkeys-* : Evicts from entire keyspace<br />├─ allkeys-lru    : Approximate LRU (most recently used)<br />├─ allkeys-lfu    : Approximate LFU (least frequently used)<br />├─ allkeys-random : Random eviction</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-g2-2" data-look="classic" transform="translate(581, 172)"><rect class="basic label-container" style="" x="-146" y="-128" width="292" height="256"/><g class="label" style="" transform="translate(-130, -120)"><rect/><foreignObject width="260" height="240"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>volatile-* : Evicts only keys with TTL set<br />├─ volatile-lru    : LRU among keys with TTL<br />├─ volatile-lfu    : LFU among keys with TTL<br />├─ volatile-ttl    : Shortest TTL first<br />├─ volatile-random : Random among keys with TTL</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-g3-3" data-look="classic" transform="translate(963, 172)"><rect class="basic label-container" style="" x="-146" y="-68" width="292" height="136"/><g class="label" style="" transform="translate(-130, -60)"><rect/><foreignObject width="260" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>noeviction : Return error on memory full<br />Writes fail with OOM error. Only use for persistent data.</p></span></div></foreignObject></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>