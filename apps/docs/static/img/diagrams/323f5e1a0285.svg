0" transform="translate(-98.4375, -12)"><foreignObject width="196.875" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>11. Deserialize value</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-ap1-0" data-look="classic" transform="translate(75.5625, 226)"><rect class="basic label-container" style="" x="-67.5625" y="-20" width="135.125" height="40"/><g class="label" style="" transform="translate(-51.5625, -12)"><rect/><foreignObject width="103.125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>Application</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-cl-1" data-look="classic" transform="translate(525.6875, 226)"><rect class="basic label-container" style="" x="-142.5625" y="-80" width="285.125" height="160"/><g class="label" style="" transform="translate(-126.5625, -72)"><rect/><foreignObject width="253.125" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>Client Library<br /><br />2. Hash key with consistent<br />hashing algorithm<br />3. Select server from ring<br />4. Open or reuse connection</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-sv-2" data-look="classic" transform="translate(1054.25, 147)"><rect class="basic label-container" style="" x="-146" y="-128" width="292" height="256"/><g class="label" style="" transform="translate(-130, -120)"><rect/><foreignObject width="260" height="240"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>Memcached Server<br /><br />5. Receive via libevent<br />event loop (epoll/kqueue)<br />6. Parse command (ASCII/binary)<br />7. Hash table lookup by key<br />8. Check expiry (lazy eviction)<br />9. Touch LRU (move to head)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-ap2-3" data-look="classic" transform="translate(1054.25, 361)"><rect class="basic label-container" style="" x="-133.1875" y="-56" width="266.375" height="112"/><g class="label" style="" transform="translate(-117.1875, -48)"><rect/><foreignObject width="234.375" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>Application<br /><br />12. Use data (or fallback<br />to database on miss)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>