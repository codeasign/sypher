><g class="label" data-id="L_SM_HR_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-TI-0" data-look="classic" transform="translate(141.125, 239)"><rect class="basic label-container" style="" x="-133.125" y="-231" width="266.25" height="462"/><g class="label" style="" transform="translate(-103.125, -216)"><rect/><foreignObject width="206.25" height="432"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Token Issuer<br />Token type: JWT (RS256 signed)<br />Private key: RSA 2048-bit<br />Header: alg RS256, typ JWT, kid key-v2<br />Payload: sub 42, email, roles [user, premium],<br />iat, exp (+3600s), jti (UUID), mfa true, sid<br />Signature: RS256(header.payload, private_key)<br />Result: JWT eyJhbGci...(truncated)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-SM-2" data-look="classic" transform="translate(141.125, 727)"><rect class="basic label-container" style="" x="-130" y="-207" width="260" height="414"/><g class="label" style="" transform="translate(-100, -192)"><rect/><foreignObject width="200" height="384"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Session Manager (Redis)<br />SET sess_abc123: user_id 42, email,<br />created_at, expires_at, ip, user_agent,<br />mfa_verified true, refresh_token_hash<br />EX 3600<br />INCR user:42:login_count<br />SET user:42:last_login<br />Result: OK (TTL 3600s)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-HR-4" data-look="classic" transform="translate(141.125, 1167)"><rect class="basic label-container" style="" x="-130" y="-183" width="260" height="366"/><g class="label" style="" transform="translate(-100, -168)"><rect/><foreignObject width="200" height="336"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>HTTP Response<br />200 OK<br />Set-Cookie session_token: HttpOnly, Secure,<br />SameSite=Lax, Max-Age=3600<br />Set-Cookie refresh_token: HttpOnly, Secure,<br />SameSite=Strict, Max-Age=2592000<br />Body: user, expires_in 3600</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>