iewBox="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5;"/></marker><marker id="my-svg_flowchart-v2-crossStart-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"/></marker><g class="root"><g class="clusters"/><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="root" transform="translate(0, 22)"><g class="clusters"><g class="cluster" id="my-svg-T" data-look="classic"><rect style="" x="8" y="-3" width="1203.375" height="760"/><g class="cluster-label" transform="translate(487.8125, 1)"><foreignObject width="243.75" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Time-Series Storage Format</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M609.688,475.5L609.688,480.917C609.688,486.333,609.688,497.167,609.688,508C609.688,518.833,609.688,529.667,609.688,535.083L609.688,540.5" id="my-svg-L_R1_LBL_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_R1_LBL_0" data-points="W3sieCI6NjA5LjY4NzUsInkiOjQ3NS41fSx7IngiOjYwOS42ODc1LCJ5Ijo1MDh9LHsieCI6NjA5LjY4NzUsInkiOjU0MC41fV0=" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_R1_LBL_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(25, 54.5)"><g class="clusters"><g class="cluster" id="my-svg-R1" data-look="classic"><rect style="" x="8" y="-3" width="1153.375" height="424"/><g class="cluster-label" transform="translate(584.6875, 1)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M516.25,220L523.75,220C531.25,220,546.25,220,560.583,220C574.917,220,588.583,220,595.417,220L602.25,220" id="my-svg-L_RAW_COMP_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_RAW_COMP_0" data-points="W3sieCI6NTE2LjI1LCJ5IjoyMjB9LHsieCI6NTYxLjI1LCJ5IjoyMjB9LHsieCI6NjA2LjI1LCJ5IjoyMjB9XQ==" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_RAW_COMP_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-RAW-0" data-look="classic" transform="translate(284.625, 220)"><rect class="basic label-container" style="" x="-231.625" y="-68" width="463.25" height="136"/><g class="label" style="" transform="translate(-215.625, -60)"><rect/><foreignObject width="431.25" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Raw Samples (64 bytes per sample):<br />┌──────────────┬──────────────┬──────────────┐<br />│ Timestamp    │ Value        │ Label Set    │<br />│ 8 bytes      │ 8 bytes      │ variable     │<br />└──────────────┴──────────────┴──────────────┘</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-COMP-1" data-look="classic" transform="translate(861.3125, 220)"><rect class="basic label-container" style="" x="-255.0625" y="-176" width="510.125" height="352"/><g class="label" style="" transform="translate(-239.0625, -168)"><rect/><foreignObject width="478.125" height="336"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">After Compression (2 bytes per sample avg):<br />┌────────────────────────────────────────────────┐<br />│ Timestamp: delta-of-delta encoding              │<br />│  ┌─────┬─────┬─────┬─────┬─────┐               │<br />│  │ d1  │ d2  │ d3  │ d4  │ d5  │ -- 1.5 bits  │<br />│  └─────┴─────┴─────┴─────┴─────┘               │<br />│  d(n) = (ts_n - ts_n-1) - (ts_n-1 - ts_n-2)    │<br />│                                                 │<br />│ Value: XOR with previous                        │<br />│  ┌─────┬─────┬─────┬─────────────────────┐     │<br />│  │ ±0  │ ±0  │ ±0  │  leading zeros...   │     │<br />│  └─────┴─────┴─────┴─────────────────────┘     │<br />│  xor = v_n XOR v_n-1  -- many trailing zeros    │<br />└────────────────────────────────────────────────┘</div><p></p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-LBL-4" data-look="classic" transform="translate(609.6875, 632.5)"><rect class="basic label-container" style="" x="-250.375" y="-92" width="500.75" height="184"/><g class="label" style="" transform="translate(-234.375, -84)"><rect/><foreignObject width="468.75" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Label Set: dictionary-compressed once per series<br />┌──────────────────────────────────────────────┐<br />│ method=GET  │ endpoint=/api/users │ 200        │<br />│ └───────────┘ └───────────────────┘ └───────┘│<br />│ Each unique string stored once, referenced    │<br />│ by integer ID in every sample                 │<br />└──────────────────────────────────────────────┘</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>