ansform="translate(138, 177)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Connection Pool (PgBouncer)<br />min 10 / max 50 connections per shard<br />timeout: 5 seconds</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-QR-1" data-look="classic" transform="translate(448, 177)"><rect class="basic label-container" style="" x="-130" y="-147" width="260" height="294"/><g class="label" style="" transform="translate(-100, -132)"><rect/><foreignObject width="200" height="264"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Query Router<br />SELECT * FROM users WHERE email = ?<br />hash(email) % 2 = 0 -&gt; Shard 0 (primary)<br />hash(email) % 2 = 1 -&gt; Shard 1 (primary)<br />UPDATE users SET password_hash always<br />goes to primary of owning shard</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-RAW-3" data-look="classic" transform="translate(758, 177)"><rect class="basic label-container" style="" x="-130" y="-135" width="260" height="270"/><g class="label" style="" transform="translate(-100, -120)"><rect/><foreignObject width="200" height="240"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Read-After-Write Consistency<br />After a write, sets flag in Redis:<br />user:123:write_ts. For 1s after the<br />write, reads go to primary. After 1s,<br />reads can use any replica.</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S0-5" data-look="classic" transform="translate(1068, 83)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Shard 0 (user_id 0-5M)<br />Primary us-east-1a<br />Replica 1 us-east-1b<br />Replica 2 us-east-1c</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S1-7" data-look="classic" transform="translate(1068, 271)"><rect class="basic label-container" style="" x="-128.4375" y="-63" width="256.875" height="126"/><g class="label" style="" transform="translate(-98.4375, -48)"><rect/><foreignObject width="196.875" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Shard 1 (user_id 5M+)<br />Primary us-east-1b<br />Replica 1 us-east-1c<br />Replica 2 us-east-1a</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>