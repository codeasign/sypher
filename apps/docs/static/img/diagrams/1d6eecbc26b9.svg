mlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 450px; text-align: center;"><span class="nodeLabel"><p>Cache Write (t=0)<br />Fresh<br />value</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-w1-2" data-look="classic" transform="translate(467, 66.5)"><rect class="basic label-container" style="" x="-77" y="-37" width="154" height="74"/><g class="label" style="" transform="translate(-75, -36)"><rect/><foreignObject width="150" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 450px; text-align: center;"><span class="nodeLabel"><p>TTL Expiry (t=N)<br />Stale<br />(auto)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-w2-3" data-look="classic" transform="translate(701.125, 66.5)"><rect class="basic label-container" style="" x="-105.125" y="-25" width="210.25" height="50"/><g class="label" style="" transform="translate(-103.125, -24)"><rect/><foreignObject width="206.25" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 450px; text-align: center;"><span class="nodeLabel"><p>next read → cache miss<br />DB query → repopulate</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-n1-4" data-look="classic" transform="translate(430.625, 266.5)"><rect class="basic label-container" style="" x="-217.625" y="-37" width="435.25" height="74"/><g class="label" style="" transform="translate(-215.625, -36)"><rect/><foreignObject width="431.25" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 450px; text-align: center;"><span class="nodeLabel"><p>Staleness window: between 0 and TTL seconds<br />(value could become stale at t=0, but won't be<br /> refreshed until t=N)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-n2-5" data-look="classic" transform="translate(430.625, 415.5)"><rect class="basic label-container" style="" x="-227" y="-85" width="454" height="170"/><g class="label" style="" transform="translate(-225, -84)"><rect/><foreignObject width="450" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 450px; text-align: center; width: 450px;"><span class="nodeLabel"><p>Typical TTL values:<br />├─ 60s: frequently changing data (scores, prices)<br />├─ 300s: moderately changing (user profiles, articles)<br />└─ 3600s: rarely changing (config, reference data)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-tm-0" data-look="classic" transform="translate(430.625, 45.5)"><rect class="basic label-container" style="" x="-170.75" y="-13" width="341.5" height="26"/><g class="label" style="" transform="translate(-168.75, -12)"><rect/><foreignObject width="337.5" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 450px; text-align: center;"><span class="nodeLabel"><p>Time ──────────────────────────────►</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>