ansform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_l3_l5_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_l4_l6_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-l0-0" data-look="classic" transform="translate(912.5625, 83.5)"><rect class="basic label-container" style="" x="-241" y="-32" width="482" height="64"/><g class="label" style="" transform="translate(-225, -24)"><rect/><foreignObject width="450" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>1. Aggregate Locally Before Sending Globally<br />Netflix: 60:1 reduction via two-tier aggregation</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-l2-2" data-look="classic" transform="translate(912.5625, 212.5)"><rect class="basic label-container" style="" x="-255.0625" y="-32" width="510.125" height="64"/><g class="label" style="" transform="translate(-239.0625, -24)"><rect/><foreignObject width="478.125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>3. Monitor the Monitoring System<br />Netflix: Chaos Monkey validates monitoring survival</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-l1-1" data-look="classic" transform="translate(330.25, 212.5)"><rect class="basic label-container" style="" x="-217.5625" y="-32" width="435.125" height="64"/><g class="label" style="" transform="translate(-201.5625, -24)"><rect/><foreignObject width="403.125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>2. Sample Aggressively at the Edge<br />Cloudflare: 99% reduction via edge sampling</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-l3-3" data-look="classic" transform="translate(330.25, 353.5)"><rect class="basic label-container" style="" x="-269.125" y="-44" width="538.25" height="88"/><g class="label" style="" transform="translate(-253.125, -36)"><rect/><foreignObject width="506.25" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>4. Plan for Cardinality From Day One<br />Discord: Migrated from Prometheus to InfluxDB and back<br />Hit cardinality limits at 500K series</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-l4-4" data-look="classic" transform="translate(912.5625, 353.5)"><rect class="basic label-container" style="" x="-283.1875" y="-44" width="566.375" height="88"/><g class="label" style="" transform="translate(-267.1875, -36)"><rect/><foreignObject width="534.375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>5. Enforce Cardinality Limits at Ingest<br />Uber: M3 rejects metrics exceeding cardinality thresholds<br />Prevents cascading pipeline failures</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-l5-5" data-look="classic" transform="translate(330.25, 506.5)"><rect class="basic label-container" style="" x="-297.25" y="-32" width="594.5" height="64"/><g class="label" style="" transform="translate(-281.25, -24)"><rect/><foreignObject width="562.5" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>6. Use the Right Storage for Each Data Type<br />Discord: Prometheus for short-term, ClickHouse for long-term</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-l6-6" data-look="classic" transform="translate(912.5625, 506.5)"><rect class="basic label-container" style="" x="-245.6875" y="-44" width="491.375" height="88"/><g class="label" style="" transform="translate(-229.6875, -36)"><rect/><foreignObject width="459.375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>7. Treat Monitoring as a Product, Not a Tool<br />Netflix: Atlas has a product manager and roadmap<br />Monitoring teams own dashboards and alert quality</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="1