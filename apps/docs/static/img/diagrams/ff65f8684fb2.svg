: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>[Reject Writes]<br />(CP choice)<br />App gets error<br />Consistency<br />preserved</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-qw-6" data-look="classic" transform="translate(697.9375, 332.5)"><rect class="basic label-container" style="" x="-109.75" y="-80" width="219.5" height="160"/><g class="label" style="" transform="translate(-93.75, -72)"><rect/><foreignObject width="187.5" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>[Queue Writes]<br />(AP choice)<br />Queue in memory<br />Risk: data loss if<br />cache crashes before<br />partition heals</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-NT-7" data-look="classic" transform="translate(345.9375, 557.5)"><rect class="basic label-container" style="" x="-146" y="-80" width="292" height="160"/><g class="label" style="" transform="translate(-130, -72)"><rect/><foreignObject width="260" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>CP approach: "I cannot guarantee consistency, so I refuse the write."<br />AP approach: "I accept the write and reconcile when the partition heals."</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="obj