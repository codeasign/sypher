 crashes → no visibility<br />Mitigation: HA deployment, secondary dash</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-f2-2" data-look="classic" transform="translate(851.625, 248.5)"><rect class="basic label-container" style="" x="-241" y="-44" width="482" height="88"/><g class="label" style="" transform="translate(-225, -36)"><rect/><foreignObject width="450" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>3. Churn<br />Dynamic labels → index growth → OOM kill<br />Mitigation: label validation, cardinality limits</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-f1-1" data-look="classic" transform="translate(292.75, 248.5)"><rect class="basic label-container" style="" x="-212.875" y="-44" width="425.75" height="88"/><g class="label" style="" transform="translate(-196.875, -36)"><rect/><foreignObject width="393.75" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>2. Overload<br />50 panels on one page → can't find signal<br />Mitigation: 12-panel limit, top-row health</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-f3-3" data-look="classic" transform="translate(292.75, 401.5)"><rect class="basic label-container" style="" x="-259.75" y="-44" width="519.5" height="88"/><g class="label" style="" transform="translate(-243.75, -36)"><rect/><foreignObject width="487.5" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>4. Death Query<br />ad-hoc query scans 2.6B points → TSDB crash<br />Mitigation: 30s timeout, 50 query limit, scan budget</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-f4-4" data-look="classic" transform="translate(851.625, 401.5)"><rect class="basic label-container" style="" x="-269.125" y="-44" width="538.25" height="88"/><g class="label" style="" transform="translate(-253.125, -36)"><rect/><foreignObject width="506.25" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>5. Time Confuse<br />Rolling windows show different data at different times<br />Mitigation: aligned time ranges, UTC</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>