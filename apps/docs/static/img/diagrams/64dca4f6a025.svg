er fills: backpressure to app cluster</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-lv-0" data-look="classic" transform="translate(81.5, 369)"><rect class="basic label-container" style="" x="-59" y="-74" width="118" height="148"/><g class="label" style="" transform="translate(-55, -72)"><rect/><foreignObject width="110" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 110px; text-align: center; width: 110px;"><span class="nodeLabel"><p>Normal: 1,000 writes/sec     Burst: 10,000 writes/sec</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>