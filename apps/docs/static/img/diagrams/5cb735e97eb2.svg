eignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-Y-0" data-look="classic" transform="translate(108, 263)"><rect class="basic label-container" style="" x="-100" y="-51" width="200" height="102"/><g class="label" style="" transform="translate(-70, -36)"><rect/><foreignObject width="140" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 140px; text-align: center; width: 140px;"><span class="nodeLabel"><p>YOU (at the terminal)<br />types a question</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-P-1" data-look="classic" transform="translate(358, 263)"><rect class="basic label-container" style="" x="-100" y="-255" width="200" height="510"/><g class="label" style="" transform="translate(-70, -240)"><rect/><foreignObject width="140" height="480"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 140px; text-align: center; width: 140px;"><span class="nodeLabel"><p>Python Script (research.py)<br />1. Reads question<br />from input<br />2. Loads API key<br />from env variable<br />3. Builds the<br />prompt message<br />4. Sends request<br />to LLM API<br />5. Parses the<br />JSON response<br />6. Prints the<br />answer to you<br />7. Saves conversation<br />to a file<br />8. Loops back to<br />step 1 for follow-ups</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L-2" data-look="classic" transform="translate(704.65625, 263)"><rect class="basic label-container" style="" x="-100" y="-111" width="200" height="222"/><g class="label" style="" transform="translate(-70, -96)"><rect/><foreignObject width="140" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 140px; text-align: center; width: 140px;"><span class="nodeLabel"><p>LLM API (Anthropic / OpenAI)<br />The Large Language Model processes<br />your prompt and generates a response</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R-3" data-look="classic" transform="translate(1094.390625, 263)"><rect class="basic label-container" style="" x="-100" y="-39" width="200" height="78"/><g class="label" style="" transform="translate(-70, -24)"><rect/><foreignObject width="140" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 140px; text-align: center; width: 140px;"><span class="nodeLabel"><p>Response displayed to you</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-4" data-look="classic" transform="translate(1344.390625, 263)"><rect class="basic label-container" style="" x="-100" y="-51" width="200" height="102"/><g class="label" style="" transform="translate(-70, -36)"><rect/><foreignObject width="140" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 140px; text-align: center; width: 140px;"><span class="nodeLabel"><p>Conversation saved to<br />research_log.txt</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>