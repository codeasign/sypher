<g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-b1-1" data-look="classic" transform="translate(114.25, 142)"><rect class="basic label-container" style="" x="-95.75" y="-97" width="191.5" height="194"/><g class="label" style="" transform="translate(-93.75, -96)"><rect/><foreignObject width="187.5" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>Broker 1<br /><br />Partition 0 LEADER<br />Partition 1 FOLLOWER<br />Partition 2 FOLLOWER<br /><br />Writes: Partition 0<br />Reads: Partition 0</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-b2-2" data-look="classic" transform="translate(306.75, 142)"><rect class="basic label-container" style="" x="-95.75" y="-97" width="191.5" height="194"/><g class="label" style="" transform="translate(-93.75, -96)"><rect/><foreignObject width="187.5" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>Broker 2<br /><br />Partition 1 LEADER<br />Partition 2 FOLLOWER<br />Partition 0 FOLLOWER<br /><br />Writes: Partition 1<br />Reads: Partition 1</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-b3-3" data-look="classic" transform="translate(499.25, 142)"><rect class="basic label-container" style="" x="-95.75" y="-97" width="191.5" height="194"/><g class="label" style="" transform="translate(-93.75, -96)"><rect/><foreignObject width="187.5" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p>Broker 3<br /><br />Partition 2 LEADER<br />Partition 0 FOLLOWER<br />Partition 1 FOLLOWER<br /><br />Writes: Part. 2<br />Reads: Part. 2</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(309.59375, 35.5)"><g class="clusters"><g class="cluster" id="my-svg-BR" data-look="classic"><rect style="" x="8" y="-3" width="730.125" height="215"/><g class="cluster-label" transform="translate(288.6875, 1)"><foreignObject width="168.75" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Brokers (3 nodes):</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="root" transform="translate(10.5, 48)"><g class="clusters"><g class="cluster" id="my-svg-CB" data-look="classic"><rect style="" x="8" y="-3" width="709.125" height="141"/><g class="cluster-label" transform="translate(231.3125, 1)"><foreignObject width="262.5" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Controller Broker (Broker 1)</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-CT-0" data-look="classic" transform="translate(362.5625, 78.5)"><rect class="basic label-container" style="" x="-316.0625" y="-49" width="632.125" height="98"/><g class="label" style="" transform="translate(-314.0625, -48)"><rect/><foreignObject width="628.125" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">│  - Manages partition assignments                               │<br />│  - Detects broker failures                                     │<br />│  - Triggers leader elections                                   │<br />│  - Uses ZooKeeper/etcd for controller election                  │</div><p></p></span></div></foreignObject></g></g></g></g></g></g><g class="node default" id="my-svg-flowchart-EP-4" data-look="classic" transform="translate(363.75, 654.5)"><rect class="basic label-container" style="" x="-325.4375" y="-37" width="650.875" height="74"/><g class="label" style="" transform="translate(-323.4375, -36)"><rect/><foreignObject width="646.875" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Each partition has exactly 1 leader                     │  Part. 2  │<br />Leadership is spread across brokers                     │  Reads:   │<br />to balance the load                                     │  Part. 2  │</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-FS-5" data-look="classic" transform="translate(1001.5625, 654.5)"><rect class="basic label-container" style="" x="-311.375" y="-85" width="622.75" height="170"/><g class="label" style="" transform="translate(-309.375, -84)"><rect/><foreignObject width="618.75" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Failure scenario (Broker 1 crashes):<br />1. Controller detects Broker 1 heartbeat timeout<br />2. Controller initiates election for Partition 0<br />3. ISR (In-Sync Replica) set for Partition 0: [Broker 2, Broker 3]<br />4. Controller assigns Partition 0 leader = Broker 2 (first in ISR)<br />5. Broker 2 begins accepting writes for Partition 0<br />6. Downtime: ~10-30 seconds (controlled by session timeout)</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>