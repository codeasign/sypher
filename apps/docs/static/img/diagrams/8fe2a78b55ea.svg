empt A — A has priority 10*)<br />          │<br />          │  T=0     T=1     T=2     T=3     T=4</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-D-5" data-look="classic" transform="translate(1011.3125, 136)"><rect class="basic label-container" style="" x="-245.6875" y="-44" width="491.375" height="88"/><g class="label" style="" transform="translate(-229.6875, -36)"><rect/><foreignObject width="459.375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">A inherits C's priority (10). B cannot preempt A<br />    anymore.<br />A releases the lock quickly. C acquires the lock.</div><p></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(25, 54.5)"><g class="clusters"><g class="cluster" id="my-svg-W1" data-look="classic"><rect style="" x="8" y="-3" width="1322.125" height="280"/><g class="cluster-label" transform="translate(533.125, 1)"><foreignObject width="271.875" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Without priority inheritance:</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M722.5,148L730,148C737.5,148,752.5,148,767.5,148C782.5,148,797.5,148,805,148L812.5,148" id="my-svg-L_A_B_0" class="edge-thickness-invisible edge-pattern-solid" style=";" data-edge="true" data-et="edge" data-id="L_A_B_0" data-points="W3sieCI6NzIyLjUsInkiOjE0OH0seyJ4Ijo3NjcuNSwieSI6MTQ4fSx7IngiOjgxMi41LCJ5IjoxNDh9XQ==" data-look="classic"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_A_B_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-A-0" data-look="classic" transform="translate(387.75, 148)"><rect class="basic label-container" style="" x="-334.75" y="-92" width="669.5" height="184"/><g class="label" style="" transform="translate(-318.75, -84)"><rect/><foreignObject width="637.5" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Priority  │<br />   10     │ Process C (high) ────────────────── WAITING ────&gt;<br />    8     │<br />    3     │ Process A (low)  ── HOLD LOCK ── Preempted ── RELEASE<br />    5     │ Process B (med)  ─────────────────────────────────── RUN<br />          │<br />          │  T=0     T=1     T=2     T=3     T=4     T=5     T=6</div><p></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-B-1" data-look="classic" transform="translate(1048.8125, 148)"><rect class="basic label-container" style="" x="-236.3125" y="-104" width="472.625" height="208"/><g class="label" style="" transform="translate(-220.3125, -96)"><rect/><foreignObject width="440.625" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 1000px; text-align: center;"><span class="nodeLabel"><p></p><div style="text-align:left;white-space:nowrap">Problem: Process C (priority 10) waits because:<br />1. A holds lock at priority 3 — C can preempt A<br />2. B (priority 5) runs on a different CPU — C<br />    cannot preempt B<br />3. A is preempted by B, so A cannot release the<br />    lock for C<br />4. C waits until B finishes and A releases the<br />    lock</div><p></p></span></div></foreignObject></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>