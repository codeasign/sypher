an></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-R-0" data-look="classic" transform="translate(178.625, 83)"><rect class="basic label-container" style="" x="-170.625" y="-75" width="341.25" height="150"/><g class="label" style="" transform="translate(-140.625, -60)"><rect/><foreignObject width="281.25" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>POST /token: grant_type=authorization_code,<br />code, code_verifier, redirect_uri, client_id, client_authentication</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S1-2" data-look="classic" transform="translate(178.625, 331)"><rect class="basic label-container" style="" x="-130" y="-123" width="260" height="246"/><g class="label" style="" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>1. Authenticate Client: public_client? skip secret.<br />confidential? verify secret (basic or post).<br />Fail -&gt; invalid_client (401)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S2-4" data-look="classic" transform="translate(178.625, 627)"><rect class="basic label-container" style="" x="-130" y="-123" width="260" height="246"/><g class="label" style="" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>2. Validate Authorization Code: exists in DB?<br />belongs to this client? not expired? not consumed?<br />redirect_uri matches? Fail -&gt; invalid_grant (400)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S3-6" data-look="classic" transform="translate(178.625, 899)"><rect class="basic label-container" style="" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>3. Verify PKCE: hash code_verifier with SHA256,<br />compare to stored code_challenge.<br />Mismatch -&gt; invalid_grant (400)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S4-8" data-look="classic" transform="translate(178.625, 1171)"><rect class="basic label-container" style="" x="-130" y="-123" width="260" height="246"/><g class="label" style="" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>4. Issue Tokens: build JWT access token, sign RS256,<br />generate opaque refresh token, store hash in DB,<br />mark auth code consumed, return JSON response</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5EA3E6" stop-opacity="1"/><stop offset="100%" stop-color="#57B26A" stop-opacity="1"/></linearGradient></svg>