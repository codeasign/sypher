<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Article">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="700" cy="70" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="90" cy="400" r="150" fill="#ffffff" opacity="0.05"/>
  <rect width="800" height="180" fill="url(#glow)"/>

  <!-- article sheet -->
  <g transform="translate(316 120)">
    <rect x="0" y="0" width="168" height="210" rx="14" fill="#ffffff" opacity="0.94"/>
    <rect x="24" y="30" width="120" height="12" rx="6" fill="#4338ca" opacity="0.85"/>
    <rect x="24" y="58" width="120" height="8" rx="4" fill="#94a3b8"/>
    <rect x="24" y="78" width="120" height="8" rx="4" fill="#94a3b8"/>
    <rect x="24" y="98" width="88" height="8" rx="4" fill="#94a3b8"/>
    <rect x="24" y="126" width="120" height="52" rx="8" fill="#c7d2fe"/>
    <circle cx="52" cy="152" r="14" fill="#4338ca" opacity="0.75"/>
    <rect x="74" y="144" width="58" height="7" rx="3.5" fill="#64748b"/>
    <rect x="74" y="157" width="44" height="7" rx="3.5" fill="#94a3b8"/>
  </g>

  <!-- pen, overlapping the sheet corner -->
  <g transform="translate(452 236) rotate(45)">
    <rect x="0" y="0" width="26" height="118" rx="10" fill="#f59e0b"/>
    <rect x="0" y="0" width="26" height="26" rx="10" fill="#fbbf24"/>
    <path d="M0 118 L13 148 L26 118 Z" fill="#1f2937"/>
  </g>
</svg>
