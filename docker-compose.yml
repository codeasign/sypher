# Single-droplet production stack: Postgres + apps/api + apps/web + Caddy
# (automatic TLS). One docker-compose.yml serves two purposes:
#
#   Local build/verification:  docker compose build && docker compose up
#     (uses each service's `build:` block — this repo, this machine)
#
#   Production deploy:         docker compose pull && docker compose up -d
#     (uses each service's `image:` field instead — a tag already pushed by
#     .github/workflows/deploy.yml to ghcr.io. The droplet never runs a
#     Docker build itself.)
#
# Copy .env.example to .env and fill in real values before running either.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sypher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sypher_next}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sypher} -d ${POSTGRES_DB:-sypher_next}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # No ports published to the host — only other containers on the
    # `internal` network (api) can reach Postgres. Uncomment to inspect it
    # from the droplet's host shell directly (e.g. psql, pg_dump):
    # ports:
    #   - '127.0.0.1:5432:5432'

  api:
    image: ${API_IMAGE:-sypher-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sypher}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sypher_next}?schema=public
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sypher_next_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      FRONTEND_URL: ${FRONTEND_URL}
      API_BASE_URL: ${API_BASE_URL}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      RECAPTCHA_REQUIRED: ${RECAPTCHA_REQUIRED:-true}
      IMPORT_TOOL_SECRET: ${IMPORT_TOOL_SECRET}
      IMPORT_ADMIN_EMAIL: ${IMPORT_ADMIN_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_DAILY_LIMIT: ${BREVO_DAILY_LIMIT}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_SENDER_EMAIL: ${RESEND_SENDER_EMAIL}
      RESEND_DAILY_LIMIT: ${RESEND_DAILY_LIMIT}
      RESEND_MONTHLY_LIMIT: ${RESEND_MONTHLY_LIMIT}
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE}
      BUNNY_STORAGE_ACCESS_KEY: ${BUNNY_STORAGE_ACCESS_KEY}
      BUNNY_STORAGE_HOSTNAME: ${BUNNY_STORAGE_HOSTNAME}
      BUNNY_PULL_ZONE_URL: ${BUNNY_PULL_ZONE_URL}
      BUNNY_TOKEN_AUTH_KEY: ${BUNNY_TOKEN_AUTH_KEY}
      JUDGE0_RAPIDAPI_KEY: ${JUDGE0_RAPIDAPI_KEY}
      JUDGE0_RAPIDAPI_HOST: ${JUDGE0_RAPIDAPI_HOST:-judge0-ce.p.rapidapi.com}
      JUDGE0_MONTHLY_LIMIT_PAID: ${JUDGE0_MONTHLY_LIMIT_PAID}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      PAID_UPGRADE_PRICE_INR_PAISE: ${PAID_UPGRADE_PRICE_INR_PAISE:-99900}
      PAID_UPGRADE_GST_RATE: ${PAID_UPGRADE_GST_RATE:-0.18}
      PAID_UPGRADE_DURATION_DAYS: ${PAID_UPGRADE_DURATION_DAYS:-365}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      LOG_ENABLED: ${LOG_ENABLED:-true}
    networks: [internal]

  web:
    image: ${WEB_IMAGE:-sypher-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3002
      # Next's standalone server.js reads HOSTNAME as its bind address —
      # Docker auto-sets HOSTNAME to the container ID when nothing else
      # sets it, which resolves to the container's own network IP, not
      # "listen on every interface." Without this override the app is only
      # reachable via Docker's NAT'd port-forwarding path, never from
      # another container on the same network (Caddy, or this healthcheck)
      # hitting it directly — found via the healthcheck failing while an
      # external curl through the published port worked fine.
      HOSTNAME: 0.0.0.0
      # Server-side (SSR) API calls go straight to the api container over
      # the internal Docker network — never out through Caddy/the public
      # internet and back in. Browser-side calls still use
      # NEXT_PUBLIC_API_BASE_URL (a build arg above), the real public URL.
      API_INTERNAL_URL: http://api:4000
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE}
      BUNNY_STORAGE_ACCESS_KEY: ${BUNNY_STORAGE_ACCESS_KEY}
      BUNNY_STORAGE_HOSTNAME: ${BUNNY_STORAGE_HOSTNAME}
      BUNNY_PULL_ZONE_URL: ${BUNNY_PULL_ZONE_URL}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
      UPLOAD_MAX_VIDEO_MB: ${UPLOAD_MAX_VIDEO_MB:-50}
      UPLOAD_MAX_ZIP_MB: ${UPLOAD_MAX_ZIP_MB:-10}
      NAVBAR_SHOW_HIRE_WITH_US: ${NAVBAR_SHOW_HIRE_WITH_US:-false}
      NAVBAR_SHOW_MOCK_INTERVIEW: ${NAVBAR_SHOW_MOCK_INTERVIEW:-false}
      NAVBAR_SHOW_RESUME_REVIEW: ${NAVBAR_SHOW_RESUME_REVIEW:-false}
      NAVBAR_SHOW_TEAM_ACCESS: ${NAVBAR_SHOW_TEAM_ACCESS:-false}
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      CORPORATE_DOMAIN: ${CORPORATE_DOMAIN:-}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
